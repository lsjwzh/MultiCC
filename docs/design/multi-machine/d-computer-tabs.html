<div id="settings-veil" class="veil" hidden><section id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title"></section></div>

<script>
'use strict';
const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',folder:'M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z',monitor:'M3 4h18v13H3z M8 21h8 M12 17v4',laptop:'M5 4h14v13H5z M2 20h20l-3-3H5z',plus:'M12 5v14 M5 12h14',settings:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',file:'M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7',layers:'M3 7l9-4 9 4-9 4z M3 12l9 4 9-4 M3 17l9 4 9-4',bell:'M5 17h14l-2-4V9a5 5 0 0 0-10 0v4z M10 21h4',search:'M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M14 14l6 6',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',close:'M6 6l12 12 M18 6 6 18',copy:'M8 8h12v13H8z M4 16H2V2h13v3',arrow:'M4 12h16 M15 7l5 5-5 5',refresh:'M20 7v5h-5 M4 17v-5h5 M19 12a7 7 0 0 0-12-5L4 10 M5 12a7 7 0 0 0 12 5l3-3',moon:'M21 13A9 9 0 0 1 11 3 9 9 0 1 0 21 13',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.folder}"/></svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const machines=[{id:'work',name:'工作电脑',kind:'laptop',online:true,note:'日常研发与设计',running:2,waiting:1,dirs:[{name:'产品研发',path:'/工作区/产品研发',run:2,wait:1,time:'刚刚',color:'blue'},{name:'视觉设计',path:'/工作区/视觉设计',run:0,wait:0,time:'一小时前',color:'purple'}],config:{model:'主力模型',effort:'深入思考',concurrency:'3',name:'工作电脑',notify:true,awake:false}},{id:'mini',name:'家用小主机',kind:'monitor',online:true,note:'长期在线，承接内容与定时任务',running:3,waiting:1,dirs:[{name:'内容工作室',path:'/工作区/内容工作室',run:2,wait:1,time:'刚刚',color:'purple'},{name:'店铺运营',path:'/工作区/店铺运营',run:1,wait:0,time:'五分钟前',color:'blue'},{name:'个人知识库',path:'/工作区/个人知识库',run:0,wait:0,time:'昨天',color:'teal'}],config:{model:'均衡模型',effort:'标准',concurrency:'5',name:'家用小主机',notify:true,awake:true}},{id:'lab',name:'测试电脑',kind:'monitor',online:false,note:'上次连接：今天上午九点四十分',running:0,waiting:0,dirs:[],config:{model:'轻量模型',effort:'标准',concurrency:'2',name:'测试电脑',notify:false,awake:false}}];
const state={view:'machines',machine:'mini',query:'',settings:null,category:'models',unified:false,dirty:false,usage:{sound:false,notice:true},lastFocus:null,settingsFocus:null,dialogFocus:null};
const current=()=>machines.find(m=>m.id===(state.view==='machines'?state.machine:'work'));
function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(node=>node.innerHTML=icon(node.dataset.icon));}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3200);}
function machineStrip(){const host=$('machine-strip');host.hidden=state.view!=='machines';host.innerHTML=machines.map(m=>`<button class="machine-tab ${m.id===state.machine?'active':''}" data-machine="${m.id}" role="tab" aria-selected="${m.id===state.machine}" aria-label="${esc(m.name)}，${m.online?'在线':'连接中断'}"><span class="computer-icon">${icon(m.kind)}</span><span><strong>${esc(m.name)}${m.id==='work'?'<span class="entry-tag">入口</span>':''}</strong><small><i class="dot ${m.online?'':'gray'}"></i>${m.online?'在线 · '+m.dirs.length+' 个目录':'连接中断'}</small></span>${m.waiting?`<span class="machine-badge" aria-label="${m.waiting} 项待处理">${m.waiting}</span>`:''}</button>`).join('')+`<button class="machine-tab add" data-action="add-machine" aria-label="添加电脑">${icon('plus')}</button>`;$('machine-count').textContent=machines.length;}
function directoryCard(dir,index){return `<button class="dir-card" data-directory="${index}"><div class="dir-top"><span class="folder ${dir.color}">${icon('folder')}</span><strong>${esc(dir.name)}</strong><span class="chevron">›</span></div><p class="dir-path">${esc(dir.path)}</p><div class="dir-bottom">${dir.run?`<span class="tiny-status"><i class="dot"></i>${dir.run} 项进行中</span>`:'<span class="tiny-status"><i class="dot gray"></i>暂无运行任务</span>'}${dir.wait?`<span class="tiny-status wait"><i class="dot amber"></i>${dir.wait} 项等你处理</span>`:''}<span class="dir-time">${esc(dir.time)}</span></div></button>`;}
function render(){machineStrip();document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));});const m=current();$('search').placeholder=state.view==='tasks'?'搜索任务':'搜索目录';$('search').setAttribute('aria-label',$('search').placeholder);$('scope-note').textContent=state.view==='machines'?'切换电脑只切换这里的目录；侧栏仍保留工作电脑上的最近任务。':'当前展示工作电脑的内容；其他电脑的目录和配置在“多电脑”里。';if(state.view==='tasks'){renderLocalTasks();return;}
 const header=`<div class="machine-header"><div><div class="machine-heading"><h2>${esc(m.name)}</h2><span class="pill ${m.online?'':'gray'}">${m.online?'在线':'连接中断'}</span></div><p class="machine-description">${esc(m.note)}</p></div><div class="machine-actions"><button class="ghost screen-button" data-action="screen" ${m.online?'':'disabled'}>${icon('monitor')}屏幕</button><button class="settings-button" data-action="machine-settings">${icon('settings')}电脑设置</button></div></div>`;
 if(!m.online){$('workspace').innerHTML=`<section class="workspace-panel">${header}<div class="offline"><div class="large-icon">${icon('moon')}</div><h3>暂时连接不上这台电脑</h3><p>可能是电脑休眠或网络中断。其他电脑仍可正常使用。</p><p class="cached">上次连接：今天上午九点四十分</p><div><button data-action="reconnect">${icon('refresh')}重新连接</button></div></div></section>`;return;}
 const dirs=m.dirs.map((d,i)=>({d,i})).filter(({d})=>(d.name+d.path).includes(state.query));$('workspace').innerHTML=`<section class="workspace-panel">${header}<div class="signal-row"><span class="signal"><i class="dot"></i><strong>${m.running}</strong>项进行中</span><span class="signal wait"><i class="dot amber"></i><strong>${m.waiting}</strong>项等你处理</span><span class="signal-right">状态更新于刚刚</span></div><div class="directory-section"><div class="section-title"><h3>工作目录<span>${m.dirs.length} 个</span></h3><button class="ghost" data-action="add-directory">${icon('plus')}添加目录</button></div><div class="dir-grid">${dirs.map(({d,i})=>directoryCard(d,i)).join('')}${state.query?'':`<button class="dir-card add-directory" data-action="add-directory">${icon('plus')}在${esc(m.name)}上添加目录</button>`}</div>${!dirs.length&&state.query?'<p class="no-results">没有找到匹配的目录</p>':''}</div></section>`;
}
function taskRows(machine,dir){const tasks=dir?[{title:`确认${dir.name}的下一步方向`,status:'等你处理',wait:true},{title:`整理${dir.name}的最新进度`,status:'进行中',wait:false}]:[{title:'商品页交互调整',status:'进行中',wait:false},{title:'确认首页视觉方向',status:'等你处理',wait:true},{title:'整理本周工作记录',status:'已完成',done:true}];return tasks.filter(t=>t.title.includes(state.query)).map(t=>`<button class="task-row" data-action="task-preview"><i class="dot ${t.wait?'amber':t.done?'gray':''}"></i><span><strong>${esc(t.title)}</strong><small>${esc(machine.name)} · ${esc(dir?.name||'产品研发')}</small></span><span>${t.status} ›</span></button>`).join('')||'<p class="no-results">没有找到匹配的任务</p>';}
function renderLocalTasks(){$('workspace').innerHTML=`<section class="workspace-panel"><div class="machine-header"><div><h2>手上的任务</h2><p class="machine-description">工作电脑 · 最近使用与待处理任务</p></div><span class="spacer"></span><span class="pill">入口电脑</span></div><div class="task-list">${taskRows(machines[0])}</div></section>`;}
function openSettings(id,{unified=false,category='models'}={}){state.settingsFocus=document.activeElement;state.settings=id;state.category=category;state.unified=unified;state.dirty=false;state.draft=id==='usage'?{...state.usage}:{...machines.find(m=>m.id===id).config};$('settings-veil').hidden=false;document.body.style.overflow='hidden';renderSettings();$('drawer').querySelector('[data-action="close-settings"]')?.focus();}
function settingsCategories(){return [['models','模型与运行'],['connect','连接与通知'],['data','数据与密钥'],['system','系统']];}
function selectField(label,key,choices,hint=''){return `<label class="field"><span>${label}</span><select data-config="${key}" aria-label="${label}">${choices.map(c=>`<option ${String(state.draft[key])===c?'selected':''}>${esc(c)}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</label>`;}
function toggle(key,label,description){return `<div class="setting-row"><div><strong>${label}</strong><p>${description}</p></div><button class="toggle" role="switch" aria-checked="${!!state.draft[key]}" aria-label="${label}" data-toggle="${key}"></button></div>`;}
function renderSettings(){const usage=state.settings==='usage',m=usage?null:machines.find(m=>m.id===state.settings),title=usage?'使用偏好':`${m.name}的设置`;
 const scope=usage?`${icon('shield')}<span>作用于当前使用端的显示与提醒</span>`:`${icon('monitor')}<span>修改仅作用于 <strong>${esc(m.name)}</strong></span><span class="spacer"></span>${state.unified?`<select class="target-select" id="settings-target" aria-label="设置对象">${machines.map(item=>`<option value="${item.id}" ${item.id===m.id?'selected':''}>${esc(item.name)}</option>`).join('')}</select>`:'<span style="font-size:9px">电脑级配置</span>'}`;
 const unified=state.unified?`<div class="usage-tabs"><button data-settings-scope="usage" class="${usage?'active':''}">使用偏好</button><button data-settings-scope="work" class="${usage?'':'active'}">电脑配置</button></div>`:'';
 let content='';
 if(usage){content=`<p class="setting-section-title">按你的使用习惯调整</p>${selectField('界面语言','language',['中文'],'切换查看的电脑，不会改变界面语言。')}${toggle('sound','语音播报','在当前设备上朗读任务提醒')}${toggle('notice','显示任务通知','在当前设备上展示需要处理的提醒')}<div class="settings-divider"></div><div class="mini-info">电脑的推送通道、模型账号与运行参数，请在“电脑配置”里选择目标电脑后修改。</div>`;}
 else if(!m.online){content=`<div class="settings-offline">${icon('moon')}<h3>连接恢复后可修改配置</h3><p>当前无法读取${esc(m.name)}的最新配置。</p><p>配置不会暂存后自动下发。</p></div>`;}
 else if(state.category==='models'){content=`<p class="setting-section-title">这台电脑的默认运行方式</p>${selectField('默认模型','model',['主力模型','均衡模型','轻量模型'],'创建任务时默认使用，任务内仍可单独调整。')}<div class="field-row">${selectField('思考深度','effort',['标准','深入思考'])}${selectField('同时运行任务数','concurrency',['1','2','3','4','5'])}</div><div class="settings-divider"></div><p class="setting-section-title">账号与运行环境</p><div class="setting-row"><span class="folder">${icon('layers')}</span><div><strong>模型账号</strong><p>${esc(m.name)}独立保存与使用</p></div><span class="pill">已配置 · 示例</span></div><div class="setting-row"><span class="folder teal">${icon('shield')}</span><div><strong>命令行工具</strong><p>使用这台电脑已安装的工具</p></div><span class="pill">可用 · 示例</span></div><div class="copy-box">${icon('copy')}<div><strong>另一台电脑已经配好了？</strong><p>选择要复制的项目，保留这台电脑的独立设置。</p></div><button data-action="copy-config">复制配置</button></div>`;}
 else if(state.category==='connect'){content=`<p class="setting-section-title">由这台电脑发送的提醒</p>${toggle('notify','任务完成后发送通知','使用此电脑独立配置的推送通道')}<div class="setting-row"><div><strong>推送通道</strong><p>已配置一个通道 · 示例</p></div><span class="pill">可用</span></div><div class="settings-divider"></div><p class="setting-section-title">远程连接</p><div class="setting-row"><div><strong>远程访问</strong><p>已授权当前入口访问 · 示例</p></div><span class="pill">已连接</span></div><div class="mini-info">消息桥接账号与接收绑定单独配置，复制模型运行参数不会启用第二个消息接收端。</div>`;}
 else if(state.category==='data'){content=`<p class="setting-section-title">数据留在所属电脑上</p><div class="setting-row"><span class="folder">${icon('shield')}</span><div><strong>保险箱</strong><p>模型密钥与凭据仅供${esc(m.name)}使用</p></div><span class="pill">已配置 · 示例</span></div><div class="settings-divider"></div><div class="setting-row"><div><strong>目录与文件</strong><p>当前电脑的工作目录，不随切换自动同步</p></div><span class="muted">${m.dirs.length} 个目录</span></div><div class="mini-info">草案中的“复制配置”仅演示默认模型、思考深度与并发数。密钥、本地路径和登录态不包含在内。</div>`;}
 else{content=`<p class="setting-section-title">电脑信息</p><label class="field"><span>电脑名称</span><input data-config="name" aria-label="电脑名称" value="${esc(state.draft.name)}" maxlength="20"><small>方便在目录、任务和通知中识别这台电脑。</small></label>${toggle('awake','保持唤醒','允许此电脑在长期任务期间保持运行')}<div class="settings-divider"></div><div class="mini-info">服务升级与重启应单独操作，并明确影响的电脑及正在运行的任务。</div>`;}
 $('drawer').innerHTML=`<div class="drawer-head"><div class="drawer-eyebrow">${icon('grid')}控制台 ／ ${state.unified?'设置':'多电脑'}</div><div class="drawer-title-row"><h2 id="settings-title">${esc(title)}</h2><button class="icon-only" data-action="close-settings" aria-label="关闭设置">${icon('close')}</button></div><div class="scope-banner">${scope}</div></div>${usage?'':`<div class="drawer-tabs" role="tablist" aria-label="电脑设置分类">${settingsCategories().map(([id,label])=>`<button class="drawer-tab ${state.category===id?'active':''}" role="tab" aria-selected="${state.category===id}" data-category="${id}">${label}</button>`).join('')}</div>`}<div class="drawer-body">${unified}${content}</div><div class="drawer-footer"><small>${state.dirty?'有尚未保存的修改':'仅为视觉草案，不会修改真实配置'}</small><button data-action="close-settings">取消</button><button class="primary" data-action="save-settings" ${!usage&&!m.online?'disabled':''}>${usage?'保存使用偏好':'保存到'+esc(m.name)}</button></div>`;
}
function closeSettings(){if(state.dirty){confirmDiscard('关闭设置',()=>{state.dirty=false;closeSettings();});return;}$('settings-veil').hidden=true;state.settings=null;document.body.style.overflow='';state.settingsFocus?.focus();}
function changeSettingsTarget(id){if(state.dirty){confirmDiscard('切换设置对象',()=>{state.dirty=false;switchSettings(id);});return;}switchSettings(id);}
function switchSettings(id){state.settings=id;state.draft=id==='usage'?{...state.usage}:{...machines.find(m=>m.id===id).config};state.dirty=false;renderSettings();}
function confirmDiscard(action,proceed){showDialog(`<h2 id="dialog-title">有尚未保存的修改</h2><p>${action}前，需要处理当前修改。</p><div class="dialog-actions"><button data-action="close-dialog">继续编辑</button><button class="primary" id="discard-confirm">放弃修改并继续</button></div>`);$('discard-confirm').onclick=()=>{closeDialog();proceed();};}
function showDialog(html,{wide=false}={}){state.dialogFocus=document.activeElement;$('dialog').innerHTML=html;$('dialog').classList.toggle('directory-dialog',wide);$('dialog-veil').hidden=false;document.body.style.overflow='hidden';$('dialog').querySelector('input,select,button')?.focus();}
function closeDialog(){$('dialog-veil').hidden=true;if($('settings-veil').hidden)document.body.style.overflow='';state.dialogFocus?.focus();}
function openDirectory(index){const m=current(),dir=m.dirs[index];state.directory={machine:m.id,index};showDialog(`<div class="drawer-eyebrow">${icon('monitor')}${esc(m.name)} ／ 工作目录</div><div class="dir-dialog-heading"><span class="folder ${dir.color}">${icon('folder')}</span><div><h2 id="dialog-title">${esc(dir.name)}</h2><p class="modal-description">${esc(dir.path)}</p></div></div><div class="selected-target">这里的任务在${esc(m.name)}上执行</div><div class="task-list">${taskRows(m,dir)}</div><div class="dialog-actions"><button data-action="directory-settings">${icon('settings')}目录设置</button><button class="primary" data-action="close-dialog">返回电脑目录</button></div>`,{wide:true});}
function addDirectory(){const m=current();showDialog(`<h2 id="dialog-title">添加工作目录</h2><p>目标电脑：${esc(m.name)} · 仅在草案中添加示例</p><form id="add-directory-form"><label class="field"><span>目录名称</span><input id="directory-name" placeholder="例如：研究项目" required maxlength="30"></label><label class="field"><span>目录路径</span><input id="directory-path" value="/工作区/新目录" required></label><div class="dialog-actions"><button type="button" data-action="close-dialog">取消</button><button class="primary">添加到${esc(m.name)}</button></div></form>`);$('add-directory-form').onsubmit=e=>{e.preventDefault();m.dirs.push({name:$('directory-name').value.trim(),path:$('directory-path').value.trim(),run:0,wait:0,time:'刚刚',color:'blue'});closeDialog();render();toast('示例目录已添加，未修改真实文件。');};}
function newTask(source){const m=source==='entry'?machines[0]:current();if(!m.online){toast('这台电脑连接中断，请先选择一台在线电脑。');return;}showDialog(`<h2 id="dialog-title">新建任务</h2><p>执行位置会在创建前明确显示。</p><div class="selected-target">${icon(m.kind)} ${esc(m.name)} · 在线</div><form id="task-form"><label class="field"><span>任务目标</span><input id="task-title" placeholder="描述你想完成的工作" required maxlength="100"></label><label class="field"><span>工作目录</span><select id="task-directory">${m.dirs.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('')}</select></label><div class="dialog-actions"><button type="button" data-action="close-dialog">取消</button><button class="primary" ${m.dirs.length?'':'disabled'}>在${esc(m.name)}上创建</button></div></form>`);$('task-form').onsubmit=e=>{e.preventDefault();closeDialog();toast('已演示创建流程，未提交真实任务。');};}
function addMachine(){showDialog(`<h2 id="dialog-title">添加电脑</h2><p>演示配对后的列表效果，不建立真实连接。</p><form id="machine-form"><label class="field"><span>电脑名称</span><input id="machine-name" placeholder="例如：办公室电脑" required maxlength="20"></label><div class="mini-info">正式连接时，在目标电脑上确认授权，再加入此列表。</div><div class="dialog-actions"><button type="button" data-action="close-dialog">取消</button><button class="primary">添加示例电脑</button></div></form>`);$('machine-form').onsubmit=e=>{e.preventDefault();const name=$('machine-name').value.trim();if(!name)return;const id='added-'+machines.length;machines.push({id,name,kind:'monitor',online:true,note:'新添加的示例电脑',running:0,waiting:0,dirs:[],config:{model:'均衡模型',effort:'标准',concurrency:'2',name,notify:false,awake:false}});state.machine=id;state.query='';$('search').value='';closeDialog();render();};}
function copyConfig(){const target=machines.find(m=>m.id===state.settings),sources=machines.filter(m=>m.online&&m.id!==target.id);showDialog(`<h2 id="dialog-title">从其他电脑复制配置</h2><p>复制到${esc(target.name)}，应用前可检查具体项目。</p><label class="field"><span>来源电脑</span><select id="copy-source">${sources.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><div id="copy-preview"></div><div class="mini-info">复制结果先进入当前表单，点击“保存到${esc(target.name)}”后在本页演示生效。</div><div class="dialog-actions"><button data-action="close-dialog">取消</button><button class="primary" id="copy-apply">应用所选项目</button></div>`);const preview=()=>{const m=machines.find(m=>m.id===$('copy-source').value);$('copy-preview').innerHTML=[['model','默认模型'],['effort','思考深度'],['concurrency','同时运行任务数']].map(([key,label])=>`<label class="check-row"><input type="checkbox" data-copy-key="${key}" checked>${label}<small>${esc(state.draft[key])} → ${esc(m.config[key])}</small></label>`).join('');};$('copy-source').onchange=preview;preview();$('copy-apply').onclick=()=>{const m=machines.find(m=>m.id===$('copy-source').value);$('copy-preview').querySelectorAll('input:checked').forEach(input=>state.draft[input.dataset.copyKey]=m.config[input.dataset.copyKey]);state.dirty=true;closeDialog();renderSettings();toast('所选项目已填入表单，保存后在本页演示生效。');};}
document.addEventListener('click',e=>{const button=e.target.closest('button,[data-action]');if(!button||button.disabled)return;if(button.dataset.view){state.view=button.dataset.view;state.query='';$('search').value='';render();return;}if(button.dataset.machine){state.machine=button.dataset.machine;state.query='';$('search').value='';render();return;}if(button.dataset.directory!==undefined){openDirectory(Number(button.dataset.directory));return;}if(button.dataset.category){state.category=button.dataset.category;renderSettings();return;}if(button.dataset.toggle){const key=button.dataset.toggle;state.draft[key]=!state.draft[key];state.dirty=true;button.setAttribute('aria-checked',String(state.draft[key]));$('drawer').querySelector('.drawer-footer small').textContent='有尚未保存的修改';return;}if(button.dataset.settingsScope){changeSettingsTarget(button.dataset.settingsScope);return;}
 const action=button.dataset.action;if(action==='machine-settings')openSettings(current().id);else if(action==='global-settings')openSettings('usage',{unified:true});else if(action==='close-settings')closeSettings();else if(action==='close-dialog')closeDialog();else if(action==='new-task')newTask(button.dataset.source);else if(action==='add-directory')addDirectory();else if(action==='add-machine')addMachine();else if(action==='copy-config')copyConfig();else if(action==='save-settings'){const id=state.settings;if(id==='usage')state.usage={...state.draft};else{const m=machines.find(m=>m.id===id);m.config={...state.draft};m.name=state.draft.name.trim()||m.name;m.config.name=m.name;}state.dirty=false;render();renderSettings();toast(id==='usage'?'使用偏好已在本页保存。':`已在本页演示保存到${machines.find(m=>m.id===id).name}，未修改真实配置。`);}else if(action==='directory-settings'){const {machine,index}=state.directory,m=machines.find(m=>m.id===machine),dir=m.dirs[index];showDialog(`<h2 id="dialog-title">${esc(dir.name)}的目录设置</h2><p>${esc(m.name)} ／ ${esc(dir.path)}</p><div class="selected-target">修改范围：仅此目录，其他目录不受影响</div><label class="field"><span>任务默认模型</span><select aria-label="目录默认模型"><option>跟随${esc(m.name)}的默认模型</option><option>主力模型</option><option>均衡模型</option></select></label><div class="mini-info">任务内仍可单独调整运行参数。</div><div class="dialog-actions"><button data-action="close-dialog">关闭</button><button class="primary" id="directory-save">演示保存</button></div>`);$('directory-save').onclick=()=>{closeDialog();toast('目录配置保存流程已演示，未修改真实配置。');};}else if(action==='console'){state.view='machines';render();}else if(action==='reconnect')toast('这是离线状态演示，不会请求真实电脑。');else if(action==='screen')toast('草案预留远程屏幕入口，不连接真实设备。');else if(action==='notifications')toast('示例：家用小主机有一项任务等你处理。');else if(action==='task-preview')toast('这里展示任务入口；正式页面会保留所属电脑和目录。');else if(action==='schedules')toast('侧栏定时任务仍属于入口电脑：工作电脑。');else if(action==='resources'||action==='memory')toast('侧栏资料仍属于入口电脑：工作电脑。');});
document.addEventListener('change',e=>{if(e.target.id==='settings-target')changeSettingsTarget(e.target.value);if(e.target.dataset.config){state.draft[e.target.dataset.config]=e.target.value;state.dirty=true;$('drawer').querySelector('.drawer-footer small').textContent='有尚未保存的修改';}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;render();}if(e.target.dataset.config){state.draft[e.target.dataset.config]=e.target.value;state.dirty=true;$('drawer').querySelector('.drawer-footer small').textContent='有尚未保存的修改';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('dialog-veil').hidden)closeDialog();else if(!$('settings-veil').hidden)closeSettings();}if(e.key==='Tab'){const host=!$('dialog-veil').hidden?$('dialog'):!$('settings-veil').hidden?$('drawer'):null;if(!host)return;const elements=[...host.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
$('settings-veil').addEventListener('click',e=>{if(e.target===$('settings-veil'))closeSettings();});$('dialog-veil').addEventListener('click',e=>{if(e.target===$('dialog-veil'))closeDialog();});
hydrate();render();
</script>
</body>
</html>
