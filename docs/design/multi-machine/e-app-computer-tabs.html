<body>
<main class="presentation">
 <header class="presentation-head"><div><p class="eyebrow">多电脑交互 · 应用端</p><h1>应用端的多电脑控制台</h1><p class="intro">保留底部三个入口，在控制台里选电脑；配置用独立页面展开。</p></div><div class="prototype-note"><span data-icon="touch"></span>三个画面均可独立点击 · 全部为示例数据</div></header>
 <nav class="mobile-stages" aria-label="选择草案画面"><button data-stage="overview" class="active" aria-pressed="true">目录与切换</button><button data-stage="settings" aria-pressed="false">电脑设置</button><button data-stage="details" aria-pressed="false">模型配置</button></nav>
 <div class="storyboard">
  <section class="stage mobile-active" data-stage-panel="overview"><div class="stage-label"><span class="number">一</span>控制台 · 多电脑<span>先选电脑，再选目录</span></div><div class="phone"><div class="screen" id="phone-overview" data-device="overview"></div></div><p class="demo-caption"><strong>电脑是控制台内的一个视图。</strong><br>横滑切电脑；底部仍是控制台、定时任务、工作目录。</p></section>
  <section class="stage" data-stage-panel="settings"><div class="stage-label"><span class="number">二</span>电脑设置<span>按分类逐页进入</span></div><div class="phone"><div class="screen" id="phone-settings" data-device="settings"></div></div><p class="demo-caption"><strong>配置属于眼前这台电脑。</strong><br>点“电脑设置”进入独立页面，返回保留原电脑与目录位置。</p></section>
  <section class="stage" data-stage-panel="details"><div class="stage-label"><span class="number">三</span>模型与运行<span>保存目标始终明确</span></div><div class="phone"><div class="screen" id="phone-details" data-device="details"></div></div><p class="demo-caption"><strong>手机上逐项选择，底部固定保存。</strong><br>标题、作用范围和保存按钮都写明目标电脑。</p></section>
 </div>
 <footer class="presentation-foot"><span>视觉草案 · 操作仅在本页演示，不连接真实电脑或修改实际配置。</span><a href="../5c864ff562ad5469/index.html" id="web-preview">对照网页版草案 ↗</a></footer>
</main>
<script>
'use strict';
const shapes={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',folder:'M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z',monitor:'M3 4h18v13H3z M8 21h8 M12 17v4',laptop:'M5 4h14v13H5z M2 20h20l-3-3H5z',plus:'M12 5v14 M5 12h14',settings:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',down:'M6 9l6 6 6-6',close:'M6 6l12 12 M18 6 6 18',check:'M5 12l5 5 9-10',layers:'M3 7l9-4 9 4-9 4z M3 12l9 4 9-4 M3 17l9 4 9-4',bell:'M5 17h14l-2-4V9a5 5 0 0 0-10 0v4z M10 21h4',copy:'M8 8h12v13H8z M4 16H2V2h13v3',wifi:'M3 8c5-4 13-4 18 0 M6 12c3-3 9-3 12 0 M9 16c2-2 4-2 6 0 M12 20h.01',moon:'M21 13A9 9 0 0 1 11 3 9 9 0 1 0 21 13',refresh:'M20 7v5h-5 M4 17v-5h5 M19 12a7 7 0 0 0-12-5L4 10 M5 12a7 7 0 0 0 12 5l3-3',touch:'M9 12V5a2 2 0 0 1 4 0v6 M13 9h4l4 3-2 9H9L4 15a2 2 0 0 1 3-2l2 2',search:'M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M14 14l6 6',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-3a8 8 0 0 1 16 0v3',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2'};
const icon=name=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${shapes[name]||shapes.folder}"/></svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const machines=[{id:'work',name:'工作电脑',kind:'laptop',online:true,note:'日常研发与设计',running:2,waiting:1,dirs:[{name:'产品研发',path:'/工作区/产品研发',run:2,wait:1,time:'刚刚',color:'blue'},{name:'视觉设计',path:'/工作区/视觉设计',run:0,wait:0,time:'一小时前',color:'purple'}],config:{model:'主力模型',effort:'深入思考',concurrency:'3',notify:true,awake:false}},{id:'mini',name:'家用小主机',kind:'monitor',online:true,note:'长期在线，承接内容与定时任务',running:3,waiting:1,dirs:[{name:'内容工作室',path:'/工作区/内容工作室',run:2,wait:1,time:'刚刚',color:'purple'},{name:'店铺运营',path:'/工作区/店铺运营',run:1,wait:0,time:'五分钟前',color:'blue'},{name:'个人知识库',path:'/工作区/个人知识库',run:0,wait:0,time:'昨天',color:'teal'}],config:{model:'均衡模型',effort:'标准',concurrency:'5',notify:true,awake:true}},{id:'lab',name:'测试电脑',kind:'monitor',online:false,note:'上次连接：今天上午九点四十分',running:0,waiting:0,dirs:[],config:{model:'轻量模型',effort:'标准',concurrency:'2',notify:false,awake:false}}];
const byId=id=>machines.find(m=>m.id===id);
const base=()=>({page:'console',view:'machines',machine:'mini',target:'mini',category:'models',stack:[],draft:null,dirty:false,sheet:null,toast:'',scroll:0,query:'',scrolls:{}});
const devices={overview:base(),settings:{...base(),page:'settings',stack:[{...base(),stack:undefined,scroll:0}]},details:{...base(),page:'category',draft:{...byId('mini').config},stack:[{...base(),stack:undefined,scroll:0},{...base(),page:'settings',stack:undefined,scroll:0}]}};
const categories=[['models','模型与运行','默认模型、思考深度与并发数','layers'],['connect','连接与通知','远程连接、推送通道与消息桥接','bell'],['data','数据与密钥','保险箱、目录与存储','shield'],['system','系统与电源','电脑信息与运行状态','settings']];
const personal={sound:false,notice:true};
const statusBar=()=>`<div class="status-bar"><span>9:41</span><span class="island"></span><span class="status-right"><span class="signal-bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>${icon('wifi')}<span class="battery"></span></span></div>`;
const home=()=>'<div class="home-indicator" aria-hidden="true"></div>';
function getMachine(s){return byId(s.page==='console'&&s.view==='machines'?s.machine:'work');}
function topBar(s,title='控制台'){return `<header class="appbar"><div><h2>${title}</h2><p><span class="entry-circle"></span>当前入口 · 工作电脑</p></div><span class="sp"></span><button class="icon-button" data-action="preferences" aria-label="打开使用偏好与设置">${icon('settings')}</button></header>`;}
function routeBar(title,backLabel='返回',name=''){return `<header class="route-bar"><button class="back-button" data-action="back" aria-label="返回${backLabel}">${icon('left')}${backLabel}</button><span class="route-title">${esc(title)}</span><span class="sp"></span>${name?`<span class="route-machine">${esc(name)}</span>`:''}</header>`;}
function navigation(s){const active=s.page==='schedule'?'schedule':s.page==='library'||s.page==='directory'?'library':'console';return `<nav class="bottom-nav" aria-label="应用底部导航">${[['console','控制台','grid'],['schedule','定时任务','clock'],['library','工作目录','folder']].map(([id,label,shape])=>`<button class="nav-item ${active===id?'active':''}" data-nav="${id}" aria-current="${active===id?'page':'false'}"><span class="nav-icon">${icon(shape)}</span>${label}</button>`).join('')}</nav>${home()}`;}
function tabs(s){return `<div class="console-tabs" role="tablist" aria-label="控制台视图">${[['tasks','任务'],['dirs','目录'],['machines','多电脑']].map(([id,name])=>`<button class="${s.view===id?'active':''}" data-view="${id}" role="tab" aria-selected="${s.view===id}">${name}${id==='machines'?`<span class="tab-count">${machines.length}</span>`:''}</button>`).join('')}</div>`;}
function directoryCard(d,i){return `<button class="directory-card" data-directory="${i}"><div class="directory-main"><span class="folder-icon ${d.color}">${icon('folder')}</span><span class="directory-copy"><strong>${esc(d.name)}</strong><small>${esc(d.path)}</small></span>${icon('right')}</div><div class="directory-stats">${d.run?`<span><i class="dot"></i>${d.run} 项进行中</span>`:'<span><i class="dot gray"></i>暂无运行任务</span>'}${d.wait?`<span class="wait"><i class="dot amber"></i>${d.wait} 项等你处理</span>`:''}<span class="time">${d.time}</span></div></button>`;}
function offline(m){return `<div class="offline"><div class="sleep">${icon('moon')}</div><h3>暂时连接不上这台电脑</h3><p>电脑可能休眠或网络中断。<br>其他在线电脑仍可正常使用。</p><p class="offline-time">上次连接：今天上午九点四十分</p><div><button class="outline-button" data-action="reconnect">${icon('refresh')}重新连接</button></div></div>`;}
function machineConsole(s){const m=getMachine(s);return `<div class="machines-line"><div class="machine-scroll" role="tablist" aria-label="选择电脑">${machines.map(item=>`<button class="machine-chip ${item.id===s.machine?'active':''}" data-machine="${item.id}" role="tab" aria-selected="${item.id===s.machine}"><i class="dot ${item.online?'':'gray'}"></i>${esc(item.name)}</button>`).join('')}</div><button class="machine-menu" data-action="machine-picker" aria-label="查看全部电脑与添加电脑">${icon('down')}</button></div><section class="machine-summary"><div class="machine-top"><h3>${esc(m.name)}</h3><span class="pill ${m.online?'':'gray'}">${m.online?'在线':'连接中断'}</span><button class="settings-link" data-action="computer-settings">${icon('settings')}电脑设置</button></div><p>${esc(m.note)}</p>${m.online?`<div class="stats-line"><span><i class="dot"></i><b>${m.running}</b>项进行中</span><span class="wait"><i class="dot amber"></i>${m.waiting} 项等你处理</span></div>`:''}</section>${m.online?directories(s,m):offline(m)}`;}
function directories(s,m){const dirs=m.dirs.map((d,i)=>({d,i})).filter(({d})=>d.name.includes(s.query)||d.path.includes(s.query));return `<div class="section-heading"><h3>工作目录</h3><span>${m.dirs.length} 个</span><button data-action="add-directory">${icon('plus')}添加</button></div><div class="directory-list">${dirs.map(({d,i})=>directoryCard(d,i)).join('')||'<div class="empty">这里还没有工作目录</div>'}</div><p class="scope-hint">${icon('shield')}<span>${s.view==='machines'?'切换电脑只改变当前列表；底部其他入口仍属于工作电脑。':'这里展示工作电脑的目录；其他电脑请在“多电脑”中查看。'}</span></p>`;}
function consoleContent(s){return `${topBar(s)}${tabs(s)}<div class="page-content">${s.view==='machines'?machineConsole(s):s.view==='dirs'?`<h3 class="page-headline">工作电脑的目录</h3><p class="page-description">当前入口电脑 · 其他电脑在“多电脑”中查看</p>${directories(s,byId('work'))}`:`<h3 class="page-headline">手上的任务</h3><p class="page-description">工作电脑 · 最近使用与待处理</p><div class="task-list-card">${taskRows(byId('work'),'产品研发')}</div>`}</div><div class="create-bar"><button class="primary" data-action="new-task" ${s.view==='machines'&&!getMachine(s).online?'disabled':''}>${icon('plus')}新任务${s.view==='machines'?' · '+esc(getMachine(s).name):''}</button></div>${navigation(s)}`;}
function identity(m){return `<div class="identity-card"><span class="identity-icon">${icon(m.kind)}</span><div><div class="identity-title"><strong>${esc(m.name)}</strong><span class="pill ${m.online?'':'gray'}">${m.online?'在线':'连接中断'}</span></div><p>修改仅作用于这台电脑</p></div></div>`;}
function settingsContent(s){const m=byId(s.target),backLabel=s.stack.at(-1)?.page==='preferences'?'设置':'多电脑';return `${routeBar('电脑设置',backLabel)}<div class="page-content settings-content">${identity(m)}<p class="setting-group-label">这台电脑的配置</p><div class="setting-group">${categories.map(([id,label,subtitle,shape])=>`<button class="setting-item" data-category="${id}"><span class="setting-icon">${icon(shape)}</span><span><strong>${label}</strong><small>${subtitle}</small></span>${icon('right')}</button>`).join('')}</div><button class="copy-entry" data-action="copy-config" ${m.online?'':'disabled'}>${icon('copy')}<span><strong>从其他电脑复制配置</strong><small>选择来源和项目，检查后再保存</small></span>${icon('right')}</button><p class="plain-note">模型账号、命令行工具与保险箱，都归属${esc(m.name)}。</p></div>${home()}`;}
function scopeBanner(m){return `<div class="scope-banner">${icon('monitor')}<span>设置对象：<strong>${esc(m.name)}</strong></span><span class="pill">电脑级</span></div>`;}
function valueRow(label,hint,key,value){return `<button class="value-row" data-pick="${key}"><span><strong>${label}</strong>${hint?`<small>${hint}</small>`:''}</span><span class="value" data-value="${key}">${esc(value)}</span>${icon('right')}</button>`;}
function switchRow(label,hint,key,value){return `<div class="value-row"><span><strong>${label}</strong><small>${hint}</small></span><button class="toggle" role="switch" aria-checked="${value}" aria-label="${label}" data-toggle="${key}"></button></div>`;}
function modelsBody(s,m){return `<p class="detail-section-title">默认运行参数</p><div class="detail-block">${valueRow('默认模型','新建任务时默认使用','model',s.draft.model)}${valueRow('思考深度','按任务需要分配思考时间','effort',s.draft.effort)}${valueRow('同时运行任务数','此电脑的并发上限','concurrency',s.draft.concurrency+' 项')}</div><p class="explanation">目录可设置自己的默认参数，任务内也可单独调整。</p><p class="detail-section-title">账号与运行环境</p><div class="detail-block"><div class="run-status-row"><span class="setting-icon">${icon('user')}</span><div><strong>模型账号</strong><small>${esc(m.name)}独立保存与使用</small></div><span class="pill">已配置 · 示例</span></div><div class="run-status-row"><span class="setting-icon">${icon('shield')}</span><div><strong>命令行工具</strong><small>使用此电脑已安装的工具</small></div><span class="pill">可用 · 示例</span></div></div><button class="copy-entry" data-action="copy-config">${icon('copy')}<span><strong>从其他电脑复制运行参数</strong><small>先预览所选项目，再保存到当前电脑</small></span>${icon('right')}</button>`;}
function categoryContent(s){const m=byId(s.target),category=categories.find(c=>c[0]===s.category);let content='';if(!m.online)content=`${offline(m)}<p class="plain-note">连接恢复后才能读取和修改最新配置。</p>`;else if(s.category==='models')content=modelsBody(s,m);else if(s.category==='connect')content=`<p class="detail-section-title">由这台电脑发送的提醒</p><div class="detail-block">${switchRow('任务完成后发送通知','使用此电脑的推送通道','notify',s.draft.notify)}<div class="run-status-row"><div><strong>推送通道</strong><small>已配置一个通道 · 示例</small></div><span class="pill">可用</span></div></div><p class="detail-section-title" style="margin-top:23px">远程连接</p><div class="detail-block"><div class="run-status-row"><div><strong>当前入口已获授权</strong><small>用于访问此电脑的目录与任务</small></div><span class="pill">已连接</span></div></div><p class="settings-warning">消息桥接的账号与接收绑定，由每台电脑分别管理。</p>`;else if(s.category==='data')content=`<p class="detail-section-title">此电脑独立保存的数据</p><div class="detail-block"><div class="run-status-row"><span class="setting-icon">${icon('shield')}</span><div><strong>保险箱</strong><small>密钥与凭据留在${esc(m.name)}</small></div><span class="pill">已配置 · 示例</span></div><div class="run-status-row"><span class="setting-icon">${icon('folder')}</span><div><strong>目录与文件</strong><small>${m.dirs.length} 个工作目录</small></div></div></div><p class="settings-warning">草案中的配置复制仅包含模型、思考深度和并发数，密钥、路径与登录态单独管理。</p>`;else content=`<p class="detail-section-title">运行状态</p><div class="detail-block"><div class="run-status-row"><div><strong>电脑名称</strong><small>${esc(m.name)}</small></div><span class="pill">在线</span></div>${switchRow('长期任务期间保持唤醒','适用于这台电脑的电源设置','awake',s.draft.awake)}</div><p class="settings-warning">服务升级与重启应单独操作，并明确受影响的电脑及正在运行的任务。</p>`;
return `${routeBar(category[1],'电脑设置')}<div class="page-content settings-content">${scopeBanner(m)}${content}</div><div class="save-bar"><button class="primary" data-action="save" ${m.online?'':'disabled'}>保存到${esc(m.name)}</button><p class="save-note" data-dirty-note>${s.dirty?'有尚未保存的修改':'仅应用于这台电脑'}</p></div>${home()}`;}
function taskRows(m,dir){return [{title:'确认下一步内容方向',status:'等你处理',wait:true},{title:'整理本周发布计划',status:'进行中',wait:false}].map((t,i)=>`<button class="task-row" data-task="${i}"><i class="dot ${t.wait?'amber':''}"></i><span><strong>${t.title}</strong><small>${esc(m.name)} · ${esc(dir)}</small></span><span class="task-state">${t.status}</span>${icon('right')}</button>`).join('');}
function directoryContent(s){const m=byId(s.target),d=m.dirs[s.directory],previous=s.stack.at(-1),backLabel=previous?.page==='library'?'工作目录':previous?.view==='machines'?'多电脑':'目录';return `${routeBar(d.name,backLabel)}<div class="page-content settings-content"><div class="task-position">${icon(m.kind)}${esc(m.name)} ／ ${esc(d.name)}</div><div class="identity-card"><span class="folder-icon ${d.color}">${icon('folder')}</span><div><div class="identity-title"><strong>${esc(d.name)}</strong></div><p>${esc(d.path)}</p></div></div><div class="section-heading" style="margin-left:2px;margin-right:2px"><h3>目录里的任务</h3><button data-action="directory-settings">${icon('settings')}目录设置</button></div><div class="task-list-card" style="margin:0">${taskRows(m,d.name)}</div><p class="plain-note">此目录的任务在${esc(m.name)}上执行。</p></div><div class="create-bar"><button class="primary" data-action="new-task">${icon('plus')}在此目录新建任务</button></div>${home()}`;}
function taskContent(s){const m=byId(s.target),d=m.dirs[s.directory||0];return `${routeBar('任务','工作目录')}<div class="page-content settings-content"><div class="task-position">${icon(m.kind)}运行在${esc(m.name)} · ${esc(d.name)}</div><h2 class="task-title">确认下一步内容方向</h2><span class="pill" style="background:#faf0df;color:#b68a3f">等你处理</span><div class="task-chat"><small>任务助手 · 示例内容</small>内容计划已经整理好，建议先发布第一组主题。<p>请选择接下来的安排：</p><p><button data-action="reply-example">按建议继续</button> <button data-action="reply-example">调整发布顺序</button></p></div><p class="plain-note">回复会发送到${esc(m.name)}上的这项任务。</p></div>${home()}`;}
function preferencesContent(s){const target=byId(s.preferenceTarget||'work');return `${routeBar('设置','控制台')}<div class="page-content settings-content"><h2 class="setting-hero">使用偏好</h2><p class="setting-lead">作用于当前这部手机</p><div class="detail-block">${switchRow('语音播报','在这部手机上朗读任务提醒','sound',personal.sound)}${switchRow('显示任务通知','在这部手机上显示待处理提醒','notice',personal.notice)}</div><p class="setting-group-label" style="margin-top:25px">电脑配置</p><div class="setting-group"><button class="setting-item" data-action="settings-target"><span class="setting-icon">${icon('monitor')}</span><span><strong>设置对象</strong><small>${esc(target.name)} · 点此选择电脑</small></span>${icon('down')}</button><button class="setting-item" data-action="open-preference-computer"><span class="setting-icon">${icon('settings')}</span><span><strong>打开${esc(target.name)}的配置</strong><small>模型、连接、数据与系统</small></span>${icon('right')}</button></div><p class="plain-note">浏览“多电脑”不会改变此入口的默认设置对象。</p></div>${home()}`;}
function scheduleContent(s){return `${topBar(s,'定时任务')}<div class="page-content"><h3 class="page-headline">工作电脑的定时任务</h3><p class="page-description">当前入口电脑 · 与多电脑视图的选择分开</p><div class="schedule-item"><strong>每周工作回顾</strong><p>每周五下午五点 · 工作电脑 ／ 产品研发</p></div><div class="schedule-item"><strong>整理当天记录</strong><p>每天晚上九点 · 工作电脑 ／ 视觉设计</p></div></div><div class="create-bar"><button class="primary" data-action="schedule-example">${icon('plus')}新建定时任务</button></div>${navigation(s)}`;}
function libraryContent(s){return `${topBar(s,'工作目录')}<div class="page-content"><h3 class="page-headline">工作电脑的目录</h3><p class="page-description">当前入口电脑 · 多电脑目录从控制台进入</p>${directories({...s,view:'dirs'},byId('work'))}</div>${navigation(s)}`;}
function saveScroll(id){const s=devices[id],node=document.querySelector('#phone-'+id+' .page-content');s.scroll=node?.scrollTop||0;}
function render(id){const s=devices[id],host=document.getElementById('phone-'+id);const pages={console:consoleContent,settings:settingsContent,category:categoryContent,directory:directoryContent,task:taskContent,preferences:preferencesContent,schedule:scheduleContent,library:libraryContent};host.innerHTML=statusBar()+pages[s.page](s)+(s.sheet?sheetContent(s):'')+(s.toast?`<div class="toast ${s.page==='console'?'':'route-toast'}" role="status">${esc(s.toast)}</div>`:'');const scroller=host.querySelector('.page-content');if(scroller)scroller.scrollTop=s.scroll||0;const selected=host.querySelector('.machine-chip.active');if(selected)selected.scrollIntoView({block:'nearest',inline:'nearest'});}
function renderAll(){Object.keys(devices).forEach(render);}
function tell(id,message){const s=devices[id];s.toast=message;saveScroll(id);render(id);clearTimeout(s.toastTimer);s.toastTimer=setTimeout(()=>{s.toast='';saveScroll(id);render(id);},2800);}
function push(id,changes){const s=devices[id];saveScroll(id);const {stack,sheet,toast,toastTimer,...snapshot}=s;s.stack.push(snapshot);Object.assign(s,changes,{sheet:null,toast:'',scroll:0});render(id);}
function back(id,discard=false){const s=devices[id];if(s.dirty&&!discard){showSheet(id,{type:'discard'});return;}const previous=s.stack.pop();if(previous){Object.assign(s,previous,{sheet:null,toast:'',dirty:false});}else Object.assign(s,{page:'console',sheet:null,dirty:false,scroll:0});render(id);}
function openSettings(id,target){push(id,{page:'settings',target,draft:null,dirty:false});}
function openCategory(id,category){const s=devices[id];push(id,{page:'category',category,draft:{...byId(s.target).config},dirty:false});}
function showSheet(id,sheet){saveScroll(id);devices[id].sheet=sheet;render(id);document.querySelector('#phone-'+id+' .sheet button, #phone-'+id+' .sheet input')?.focus({preventScroll:true});}
function sheetShell(title,subtitle,body){return `<div class="sheet-veil"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drag-handle"></div><div class="sheet-heading"><h3>${title}</h3><button class="icon-button" data-action="close-sheet" aria-label="关闭弹层">${icon('close')}</button></div>${subtitle?`<p class="sheet-subtitle">${subtitle}</p>`:''}${body}${home()}</section></div>`;}
function machinePicker(s,scope){const selected=scope==='settings'?(s.preferenceTarget||'work'):s.machine;return sheetShell(scope==='settings'?'选择设置对象':'选择电脑','每台电脑保留自己的目录、任务和配置。',machines.map(m=>`<button class="sheet-row" data-choose-machine="${m.id}" data-scope="${scope}">${icon(m.kind)}<span><strong>${esc(m.name)}</strong><small>${m.online?'在线 · '+m.dirs.length+' 个目录':'连接中断 · 今天上午最后连接'}</small></span>${m.id===selected?`<span class="check">${icon('check')}</span>`:''}</button>`).join('')+(scope==='settings'?'':`<button class="outline-button sheet-add" data-action="add-machine">${icon('plus')}添加电脑</button>`));}
function sheetContent(s){const sh=s.sheet,m=byId(sh.machine||s.target),pickers={model:['默认模型',['主力模型','均衡模型','轻量模型']],effort:['思考深度',['标准','深入思考']],concurrency:['同时运行任务数',['1','2','3','4','5']]};if(sh.type==='machine-picker')return machinePicker(s,sh.scope||'browse');if(sh.type==='pick'){const [label,choices]=pickers[sh.key];return sheetShell(label,'仅调整'+esc(byId(s.target).name)+'的配置',choices.map(value=>`<button class="sheet-row" data-choice="${value}" data-key="${sh.key}"><strong>${value}${sh.key==='concurrency'?' 项':''}</strong>${s.draft[sh.key]===value?`<span class="check">${icon('check')}</span>`:''}</button>`).join(''));}
 if(sh.type==='discard')return sheetShell('有尚未保存的修改','返回前，需要处理当前配置。',`<div class="sheet-actions"><button class="outline-button" data-action="close-sheet">继续编辑</button><button class="primary" data-action="discard">放弃修改并返回</button></div>`);
 if(sh.type==='new-task')return sheetShell('新建任务','先确认执行电脑和工作目录。',`<div class="form-scope">${icon(m.kind)}执行电脑：${esc(m.name)}</div><form data-form="new-task"><label class="field"><span>任务目标</span><textarea name="title" required placeholder="描述你想完成的工作" maxlength="120"></textarea></label><label class="field"><span>工作目录</span><select name="directory">${m.dirs.map((d,i)=>`<option value="${i}" ${sh.directory===i?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><div class="sheet-actions"><button class="primary" ${m.dirs.length?'':'disabled'}>在${esc(m.name)}上创建</button></div></form>`);
 if(sh.type==='add-directory')return sheetShell('添加工作目录','目标电脑：'+esc(m.name),`<form data-form="add-directory"><label class="field"><span>目录名称</span><input name="name" required placeholder="例如：研究项目" maxlength="24"></label><label class="field"><span>目录路径</span><input name="path" required value="/工作区/新目录"></label><div class="sheet-actions"><button class="primary">添加到${esc(m.name)}</button></div></form>`);
 if(sh.type==='add-machine')return sheetShell('添加电脑','本页演示连接后的效果，不建立真实连接。',`<form data-form="add-machine"><label class="field"><span>电脑名称</span><input name="name" required placeholder="例如：办公室电脑" maxlength="18"></label><p class="plain-note">正式连接时，需要在目标电脑上确认授权。</p><div class="sheet-actions"><button class="primary">添加示例电脑</button></div></form>`);
 if(sh.type==='copy'){const source=byId(sh.source),target=byId(s.target);return sheetShell('复制运行参数','目标电脑：'+esc(target.name),`<form data-form="copy"><label class="field"><span>来源电脑</span><select name="source" data-copy-source>${machines.filter(item=>item.online&&item.id!==target.id).map(item=>`<option value="${item.id}" ${item.id===source.id?'selected':''}>${esc(item.name)}</option>`).join('')}</select></label>${[['model','默认模型'],['effort','思考深度'],['concurrency','同时运行任务数']].map(([key,label])=>`<label class="copy-check"><input type="checkbox" name="${key}" checked>${label}<small>${esc(source.config[key])}</small></label>`).join('')}<p class="plain-note">所选项目先填入表单，再保存到${esc(target.name)}。</p><div class="sheet-actions"><button class="primary">应用所选项目</button></div></form>`);}
 if(sh.type==='directory-settings'){const d=m.dirs[s.directory||0];return sheetShell('目录设置',esc(m.name)+' ／ '+esc(d.name),`<div class="form-scope">${icon('folder')}修改范围：仅此目录</div><form data-form="directory-settings"><label class="field"><span>任务默认模型</span><select name="model"><option>跟随电脑的默认模型</option><option>主力模型</option><option>均衡模型</option></select></label><p class="plain-note">任务内还可以单独调整运行参数。</p><div class="sheet-actions"><button class="primary">演示保存目录设置</button></div></form>`);}
 return '';}
function handle(id,b){const s=devices[id];if(b.dataset.view){saveScroll(id);s.scrolls[s.view]=s.scroll;s.view=b.dataset.view;s.scroll=s.scrolls[s.view]||0;render(id);return;}if(b.dataset.machine){s.machine=b.dataset.machine;s.scroll=0;s.query='';render(id);return;}if(b.dataset.nav){saveScroll(id);s.scrolls[s.page+':'+s.view]=s.scroll;s.page=b.dataset.nav;s.scroll=s.scrolls[s.page+':'+s.view]||0;s.stack=[];s.dirty=false;s.sheet=null;render(id);return;}if(b.dataset.directory!==undefined){const m=s.page==='library'?byId('work'):getMachine(s);push(id,{page:'directory',target:m.id,directory:Number(b.dataset.directory)});return;}if(b.dataset.category){openCategory(id,b.dataset.category);return;}if(b.dataset.pick){showSheet(id,{type:'pick',key:b.dataset.pick});return;}if(b.dataset.choice){s.draft[b.dataset.key]=b.dataset.choice;s.dirty=true;s.sheet=null;render(id);return;}if(b.dataset.chooseMachine){if(b.dataset.scope==='settings')s.preferenceTarget=b.dataset.chooseMachine;else{s.machine=b.dataset.chooseMachine;s.scroll=0;}s.sheet=null;render(id);return;}if(b.dataset.toggle){const key=b.dataset.toggle;if(s.page==='preferences')personal[key]=!personal[key];else{s.draft[key]=!s.draft[key];s.dirty=true;}saveScroll(id);render(id);return;}if(b.dataset.task!==undefined){const m=s.page==='console'?byId('work'):byId(s.target);push(id,{page:'task',target:m.id,directory:s.page==='console'?0:s.directory||0});return;}
 const action=b.dataset.action;if(action==='computer-settings')openSettings(id,getMachine(s).id);else if(action==='preferences')push(id,{page:'preferences',dirty:false,preferenceTarget:'work'});else if(action==='open-preference-computer')openSettings(id,s.preferenceTarget||'work');else if(action==='settings-target')showSheet(id,{type:'machine-picker',scope:'settings'});else if(action==='machine-picker')showSheet(id,{type:'machine-picker'});else if(action==='close-sheet'){s.sheet=null;render(id);}else if(action==='back')back(id);else if(action==='discard'){s.sheet=null;s.dirty=false;back(id,true);}else if(action==='add-machine')showSheet(id,{type:'add-machine'});else if(action==='new-task'){const m=s.page==='directory'?byId(s.target):getMachine(s);if(!m.online){tell(id,'这台电脑连接中断，请先选择在线电脑。');return;}showSheet(id,{type:'new-task',machine:m.id,directory:s.page==='directory'?s.directory:0});}else if(action==='add-directory'){const m=s.page==='library'?byId('work'):getMachine(s);showSheet(id,{type:'add-directory',machine:m.id});}else if(action==='directory-settings')showSheet(id,{type:'directory-settings',machine:s.target});else if(action==='save'){const m=byId(s.target);m.config={...s.draft};s.dirty=false;renderAll();tell(id,'已在本页演示保存到'+m.name+'。');}else if(action==='copy-config'){const m=byId(s.target),source=machines.find(item=>item.online&&item.id!==m.id);if(!m.online||!source)return;if(s.page==='settings'){push(id,{page:'category',category:'models',draft:{...m.config},dirty:false});}showSheet(id,{type:'copy',source:source.id});}else if(action==='reconnect')tell(id,'这是离线状态演示，不会请求真实设备。');else if(action==='reply-example')tell(id,'回复目标：'+byId(s.target).name+'上的当前任务。');else if(action==='schedule-example')tell(id,'新建定时任务的目标：工作电脑。');}
document.addEventListener('click',e=>{const stage=e.target.closest('[data-stage]');if(stage){document.querySelectorAll('[data-stage]').forEach(item=>{const active=item===stage;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active));});document.querySelectorAll('[data-stage-panel]').forEach(item=>item.classList.toggle('mobile-active',item.dataset.stagePanel===stage.dataset.stage));return;}const host=e.target.closest('[data-device]'),b=e.target.closest('button');if(!host)return;const id=host.dataset.device;if(e.target.classList.contains('sheet-veil')){devices[id].sheet=null;render(id);return;}if(b&&!b.disabled)handle(id,b);});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-copy-source')){const host=e.target.closest('[data-device]'),s=devices[host.dataset.device];s.sheet.source=e.target.value;render(host.dataset.device);}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const id=form.closest('[data-device]').dataset.device,s=devices[id],data=new FormData(form),type=form.dataset.form,sh=s.sheet;if(type==='new-task'){s.sheet=null;render(id);tell(id,'已在本页演示创建任务，目标：'+byId(sh.machine).name+'。');}else if(type==='add-directory'){const name=String(data.get('name')).trim(),path=String(data.get('path')).trim();if(!name||!path)return;byId(sh.machine).dirs.push({name,path,run:0,wait:0,time:'刚刚',color:'teal'});s.sheet=null;renderAll();tell(id,'示例目录已添加到'+byId(sh.machine).name+'。');}else if(type==='add-machine'){const name=String(data.get('name')).trim();if(!name)return;const next={id:'added-'+machines.length,name,kind:'monitor',online:true,note:'新添加的示例电脑',running:0,waiting:0,dirs:[],config:{model:'均衡模型',effort:'标准',concurrency:'2',notify:false,awake:false}};machines.push(next);s.machine=next.id;s.sheet=null;s.scroll=0;renderAll();tell(id,'示例电脑已加入列表。');}else if(type==='copy'){const source=byId(String(data.get('source')));for(const key of ['model','effort','concurrency'])if(data.has(key))s.draft[key]=source.config[key];s.dirty=true;s.sheet=null;render(id);tell(id,'已填入所选参数，请检查后保存。');}else if(type==='directory-settings'){s.sheet=null;render(id);tell(id,'目录设置保存流程已演示。');}});
document.addEventListener('keydown',e=>{const host=e.target.closest?.('[data-device]');if(!host)return;const id=host.dataset.device,s=devices[id];if(e.key==='Escape'&&s.sheet){s.sheet=null;render(id);}if(e.key==='Tab'&&s.sheet){const focusable=[...host.querySelectorAll('.sheet button,.sheet input,.sheet select,.sheet textarea')].filter(item=>!item.disabled),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
document.querySelectorAll('[data-icon]').forEach(node=>node.innerHTML=icon(node.dataset.icon));
document.getElementById('web-preview').href=location.pathname.startsWith('/artifacts/')?'/artifacts/5c864ff562ad5469/index.html':'d-computer-tabs.html';
renderAll();
</script>
