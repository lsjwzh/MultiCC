name: multicc-command-code
services:
  command-code:
    image: multicc-command-code:local
    ports:
      - "127.0.0.1:${COMMAND_CODE_PORT:-8080}:3000"
    environment:
      HOME: /var/lib/multicc/home
      HOST: 0.0.0.0
      PORT: "3000"
      MULTICC_ALLOW_REMOTE: "1"
      ACCESS_TOKEN: "${COMMAND_CODE_LAB_PASSWORD:-command-code-lab}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
      DEEPSEEK_FLASH_MODEL: "${DEEPSEEK_FLASH_MODEL:-deepseek-flash}"
      CMD_LOCAL_ONLY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - command-code-data:/var/lib/multicc
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 3g
    shm_size: 256m
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, docker/command-code/healthcheck.js]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
volumes:
  command-code-data:
