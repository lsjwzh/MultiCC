name: Temporary signed Android OTA artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-ota:
    name: Build official Android OTA artifact
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "86bdeb1c12a8c17e2a86d58b28fdb998fe485e9c"
          git diff --exit-code HEAD^ HEAD -- app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.2'
          cache: true
      - name: Prepare official signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required android-release secret $name is missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          signer="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" \
            | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$signer" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 is not a SHA-256 certificate digest"
            exit 1
          fi
          pinned_signer="$(tr -d '[:space:]:' < app/android/release-cert.sha256 \
            | tr '[:upper:]' '[:lower:]')"
          if [ "$signer" != "$pinned_signer" ]; then
            echo "::error::Signing secret does not match app/android/release-cert.sha256"
            exit 1
          fi

          keystore="$RUNNER_TEMP/multicc-release-keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::Decoded Android release keystore is empty"
            exit 1
          fi
          chmod 600 "$keystore"

          # Fail fast when the keystore does not actually carry the pinned
          # certificate (or the alias does not exist): catching it here beats
          # a full gates + build cycle that can only fail at the post-build
          # apksigner check (v1.6.3 release, run 4).
          keystore_signer="$(
            keytool -exportcert \
              -storetype PKCS12 \
              -keystore "$keystore" \
              -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
              -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            | openssl dgst -sha256 -r \
            | awk '{ print $1 }' \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$keystore_signer" != "$signer" ]; then
            echo "::error::Decoded Android release keystore certificate does not match app/android/release-cert.sha256"
            exit 1
          fi

          {
            printf 'MULTICC_ANDROID_KEYSTORE_PATH=%s\n' "$keystore"
            printf 'MULTICC_ANDROID_STORE_PASSWORD=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'MULTICC_ANDROID_KEY_ALIAS=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'MULTICC_ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            printf 'MULTICC_APK_EXPECTED_SIGNER_SHA256=%s\n' "$signer"
          } >> "$GITHUB_ENV"

      - name: Prepare optional Firebase client config
        env:
          MULTICC_FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.MULTICC_FIREBASE_ANDROID_CONFIG_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MULTICC_FIREBASE_ANDROID_CONFIG_JSON" ]; then
            config_file="$RUNNER_TEMP/multicc-google-services.json"
            printf '%s' "$MULTICC_FIREBASE_ANDROID_CONFIG_JSON" > "$config_file"
            chmod 600 "$config_file"
            echo "MULTICC_FIREBASE_ANDROID_CONFIG=$config_file" >> "$GITHUB_ENV"
          fi
      - name: Build and verify signed OTA APK
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-number=193
          cd ..
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$build_tools"
          apk_info="$($build_tools verify --verbose --print-certs "$apk")"
          signer="$(printf '%s\n' "$apk_info" | awk '/certificate SHA-256 digest:/ { print $NF; exit }' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected="$(tr -d '[:space:]:' < app/android/release-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$signer" ]; then echo '::error::APK signer digest was not found'; exit 1; fi
          if [ "$signer" != "$expected" ]; then echo '::error::APK signer does not match the pinned certificate'; exit 1; fi
          echo 'APK signature matches the pinned certificate'
          aapt="$(dirname "$build_tools")/aapt"
          if [ ! -x "$aapt" ]; then echo '::error::Android aapt is unavailable'; exit 1; fi
          badging="$($aapt dump badging "$apk")"
          if ! printf '%s\n' "$badging" | grep -F "package: name='com.multicc.multicc_app' versionCode='193' versionName='2.44.0'"; then
            echo '::error::APK package or version mismatch'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mobile-ota"
          cp "$apk" "$RUNNER_TEMP/mobile-ota/multicc.apk"
          node <<'NODE'
          const crypto = require('crypto'), fs = require('fs'), path = require('path');
          const root = path.join(process.env.RUNNER_TEMP, 'mobile-ota');
          const p = path.join(root, 'multicc.apk');
          const data = fs.readFileSync(p);
          const sha256 = crypto.createHash('sha256').update(data).digest('hex');
          const signerSha256 = fs.readFileSync('app/android/release-cert.sha256', 'utf8').trim().replace(/:/g, '').toLowerCase();
          const metadata = { schemaVersion: 1, versionName: '2.44.0', versionCode: 193,
            distribution: 'temporary-ota', sourceBase: '86bdeb1c12a8c17e2a86d58b28fdb998fe485e9c',
            gitCommit: process.env.GITHUB_SHA, sha256, size: data.length, signerSha256,
            builtAt: new Date().toISOString() };
          fs.writeFileSync(p + '.json', JSON.stringify(metadata) + '\n');
          fs.writeFileSync(p + '.sha256', sha256 + '\n');
          NODE
      - name: Preserve diagnostic APK if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ota-diagnostic
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-android-ota-193
          path: ${{ runner.temp }}/mobile-ota/multicc.apk*
          if-no-files-found: error
          retention-days: 7
