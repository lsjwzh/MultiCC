name: Rust kernels
on:
  pull_request:
    paths: ['.cargo/**', 'scripts/check-linux-cpu-compat.js', 'scripts/setup-linux-cpu-emulator.sh', 'scripts/fixtures/linux-cpu-*', 'scripts/smoke-no-node-gateway.sh', 'native/**', 'src/native/**', 'src/sqlite/**', 'src/providers/rust-cpr.js', 'src/providers/router-runtime.js', 'src/claude-auth/egress-agent.js', 'tests/test-sqlite*', 'src/routes/token-usage.js', 'src/task-board/**', 'src/routes/task-search.js', 'scripts/*rust*', 'tests/*rust*', 'tests/fixtures/rust-kernel-fixtures.js', 'scripts/generate-outbound-proxy-corpus.js', 'scripts/generate-account-subscription-fixture.js', 'scripts/generate-provider-limit-history-fixture.js', 'scripts/generate-claude-models-fixture.js', 'scripts/generate-auto-provider-fixtures.js', 'tests/test-auto-provider-fixtures.js', 'src/network/proxy-policy.js', 'tests/helpers/legacy-*-route.js', 'tests/helpers/legacy-auto-provider-*.js', 'docker/**', 'scripts/build-task-shell-image.js', '.github/workflows/rust-kernels.yml']
  workflow_dispatch:
    inputs:
      compare_v2_20_2:
        description: Reproduce the no-AVX2 SIGILL using the pinned v2.20.2 release
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        # Keep the host loader/libc below the amd64v3 baseline used by Ubuntu
        # 26.04; QEMU also executes those libraries under the selected old CPU.
        # Ubuntu 24.04 also supplies GLIBC_2.39 required by the legacy addon.
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test durable vault audit on every platform
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-core secret_audit::tests
      - name: 检查 Rust 源码
        shell: bash
        run: |
          cargo fmt --all --manifest-path native/Cargo.toml --check
          cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/Cargo.toml -p multicc-core native_session_guard::tests
          cargo test --locked --manifest-path native/Cargo.toml -p multicc-cpr
      # 远控进程的 Rust 测试必须进 CI。crate 还没落进 workspace 时明确略过，
      # 一旦 native/remote/Cargo.toml 出现就必须编过、测过。
      - name: 测试远控进程
        shell: bash
        run: |
          set -euo pipefail
          if [ -f native/remote/Cargo.toml ]; then
            cargo test --locked --manifest-path native/Cargo.toml -p multicc-remote
          else
            echo "::notice::native/remote 尚未加入 cargo workspace，跳过 multicc-remote 测试"
          fi
      # CDP 网关（native/cdpd）的路由状态机与分帧测试。
      - name: 测试 CDP 网关
        shell: bash
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-cdpd
      # Rust 前门（native/gateway）：三个平台的启动入口都经它启动 node，集成测试全平台跑。
      - name: 测试 Rust 前门
        shell: bash
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-gateway --no-fail-fast
      # `--no-node` 冒烟：前门在 PATH 里没有任何 node 的前提下启动，Rust 自有路由 200、
      # 落 Node 的路由 503 node_runtime_absent、SIGTERM 退出 0（docs/gateway.md §8.1）。
      # Windows 没有 SIGTERM / 退出码 0 语义（Git Bash 的 kill 走 TerminateProcess），
      # 跳过它；前门的集成测试仍在上一步的三个平台上跑。
      - name: 冒烟 Rust 前门 --no-node
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/Cargo.toml -p multicc-gateway
          sh scripts/smoke-no-node-gateway.sh native/target/release/multicc-gateway
      # 写者租约启动器（native/writer-launcher）：仓外 CLI 的 fail-closed 租约契约。
      - name: 测试写者租约启动器
        shell: bash
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-writer-launcher
      - name: Test desktop agent control and validation
        shell: bash
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-desktop-agent
      - name: 构建并强制执行原生差分测试
        shell: bash
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
          CARGO_TARGET_DIR: ${{ runner.temp }}/multicc-rust-target
          MULTICC_REQUIRE_RUST_TESTS: '1'
          MULTICC_REQUIRE_RUST_BUNDLE: '1'
        run: |
          set -euo pipefail
          node scripts/build-rust-kernels.js
          export MULTICC_RUST_ADDON="$(node -p 'require("node:path").join(process.env.MULTICC_RUST_PREBUILT_DIR,`${process.platform}-${process.arch}`,"multicc_core.node")')"
          # 发布链路必须两个产物齐全：模块能 require，远控进程能跑并说出协议版本。
          if [ -f native/remote/Cargo.toml ]; then
            remote_bin=multicc-remote
            if [ "$RUNNER_OS" = "Windows" ]; then remote_bin=multicc-remote.exe; fi
            remote="$MULTICC_RUST_PREBUILT_DIR/$(node -p 'process.platform+"-"+process.arch')/$remote_bin"
            [ -f "$remote" ] || { echo "::error::missing $remote"; exit 1; }
            if [ "$RUNNER_OS" != "Windows" ]; then
              [ -x "$remote" ] || { echo "::error::$remote is not executable"; exit 1; }
            fi
            "$remote" --version | grep -q '^multicc-remote 1 ' || { echo "::error::$remote --version is not multicc-remote 1"; exit 1; }
          fi
          # CDP 网关同理：v2.12.0 的安装包就是在这里没人查，悄悄缺了 multicc-cdpd。
          if [ -f native/cdpd/Cargo.toml ]; then
            cdpd_bin=multicc-cdpd
            if [ "$RUNNER_OS" = "Windows" ]; then cdpd_bin=multicc-cdpd.exe; fi
            cdpd="$MULTICC_RUST_PREBUILT_DIR/$(node -p 'process.platform+"-"+process.arch')/$cdpd_bin"
            cdpd_prefix="multicc-cdpd $(node -p 'require("./scripts/build-rust-kernels").CDPD_PROTOCOL') "
            [ -f "$cdpd" ] || { echo "::error::missing $cdpd"; exit 1; }
            if [ "$RUNNER_OS" != "Windows" ]; then
              [ -x "$cdpd" ] || { echo "::error::$cdpd is not executable"; exit 1; }
            fi
            "$cdpd" --version | grep -q "^$cdpd_prefix" || { echo "::error::$cdpd --version does not start with '$cdpd_prefix'"; exit 1; }
          fi
          # Rust 前门同理：三个平台的启动入口都经它启动 node。
          if [ -f native/gateway/Cargo.toml ]; then
            gateway_bin=multicc-gateway
            if [ "$RUNNER_OS" = "Windows" ]; then gateway_bin=multicc-gateway.exe; fi
            gateway="$MULTICC_RUST_PREBUILT_DIR/$(node -p 'process.platform+"-"+process.arch')/$gateway_bin"
            gateway_prefix="multicc-gateway $(node -p 'require("./scripts/build-rust-kernels").GATEWAY_PROTOCOL') "
            [ -f "$gateway" ] || { echo "::error::missing $gateway"; exit 1; }
            if [ "$RUNNER_OS" != "Windows" ]; then
              [ -x "$gateway" ] || { echo "::error::$gateway is not executable"; exit 1; }
            fi
            "$gateway" --version | grep -q "^$gateway_prefix" || { echo "::error::$gateway --version does not start with '$gateway_prefix'"; exit 1; }
          fi
          # The SQLite bundle test stages the complete server, including its
          # platform plugins. Build those inputs before invoking the real copier.
          if [ "$RUNNER_OS" = "Linux" ]; then
            rustup target add x86_64-unknown-linux-musl
            python3 -m venv "$RUNNER_TEMP/zigbuild"
            "$RUNNER_TEMP/zigbuild/bin/pip" install --quiet cargo-zigbuild ziglang
            export PATH="$RUNNER_TEMP/zigbuild/bin:$PATH"
          fi
          node scripts/build-plugin-binaries.js
          # test-rust-front-door-fixtures re-runs every frozen-oracle / proxy-corpus
          # generator in verify mode, so a stale fixture cannot reach a release.
          node --test tests/test-rust-cpr.js tests/test-rust-kernels.js tests/test-source-rust.js tests/test-plugin-binaries.js tests/test-rust-sqlite.js tests/test-sqlite-driver.js tests/test-orchestration-sqlite-store.js tests/test-provider-limit-cache.js tests/test-task-shells.js tests/test-search-index.js tests/test-task-search.js tests/test-token-global.js tests/test-rust-front-door-fixtures.js

      - name: 验证无 AVX 和无 AVX2 的 Linux CPU
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          bash scripts/setup-linux-cpu-emulator.sh "$RUNNER_TEMP/multicc-qemu"
          native="$RUNNER_TEMP/multicc-rust-prebuilt/linux-x64"
          node scripts/check-linux-cpu-compat.js --qemu "$RUNNER_TEMP/multicc-qemu/qemu-x86_64" \
            --node "$(command -v node)" \
            --addon "$native/multicc_core.node" --companions "$native" \
            --report "$RUNNER_TEMP/cpu-compat-current.json"

      - name: 用官方 v2.20.2 包复现无 AVX2 崩溃
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_v2_20_2
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          legacy="$RUNNER_TEMP/cpu-compat-legacy"
          mkdir -p "$legacy"
          archive=multicc-standalone-2.20.2-linux-x64.tar.gz
          curl --fail --location --retry 2 --max-time 600 \
            "https://github.com/lsjwzh/MultiCC/releases/download/v2.20.2/$archive" -o "$legacy/$archive"
          echo "d4a6eca0a1c799fe580c093b82d7483208cdb6439522c69d71f24411fd783b18  $legacy/$archive" | sha256sum -c -
          bundle=multicc-standalone-2.20.2-linux-x64
          tar -xzf "$legacy/$archive" -C "$legacy" \
            "$bundle/Resources/runtime/bin/node" \
            "$bundle/Resources/app-server/native/prebuilt/linux-x64/multicc_core.node"
          node scripts/check-linux-cpu-compat.js \
            --qemu "$RUNNER_TEMP/multicc-qemu/qemu-x86_64" \
            --node "$legacy/$bundle/Resources/runtime/bin/node" \
            --addon "$legacy/$bundle/Resources/app-server/native/prebuilt/linux-x64/multicc_core.node" \
            --expect-sigill --report "$RUNNER_TEMP/cpu-compat-v2.20.2.json"

      - name: 保存 CPU 兼容性证据
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpu-compatibility
          path: ${{ runner.temp }}/cpu-compat-*.json
          if-no-files-found: warn
          retention-days: 14

  # Node-free runtime image: build the Rust-only stage and prove it runs without
  # Node. This does not claim a Node-free server — the front door still spawns
  # `node server.js` as its upstream (docs/backend-rust-exit-plan.md).
  node-free-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Node-free runtime stage from tracked sources
        run: node scripts/build-task-shell-image.js --node-free
      - name: Smoke-test the Node-free image
        shell: bash
        run: |
          set -euo pipefail
          version="$(docker run --rm multicc-node-free:local --version)"
          echo "$version"
          echo "$version" | grep -Eq '^multicc-gateway [0-9]+ [0-9]+\.[0-9]+\.[0-9]+$'
          # No Node runtime may be reachable inside the image.
          if docker run --rm --entrypoint sh multicc-node-free:local -c 'command -v node >/dev/null 2>&1'; then
            echo "::error::the node-free runtime image contains node" >&2
            exit 1
          fi
          # multicc-writer must run without Node; exit 64 is its documented usage error.
          code=0
          docker run --rm --entrypoint /usr/local/bin/multicc-writer multicc-node-free:local >/dev/null 2>&1 || code=$?
          if [ "$code" -ne 64 ]; then
            echo "::error::multicc-writer usage exit was $code, expected 64" >&2
            exit 1
          fi
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges multicc-node-free:local --version

