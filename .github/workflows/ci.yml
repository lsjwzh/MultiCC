name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Node ${{ matrix.node }} deterministic + storage runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node remains the host; storage is provided by the Rust module built below.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: ci-linux
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build Rust SQLite
        run: node scripts/build-rust-kernels.js
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/target
          # 远控进程和模块一起编译：测试会从这棵树打包，缺件就该在这一步报出来。
          MULTICC_REQUIRE_RUST_BUNDLE: '1'
      - name: Configure Rust module
        run: echo "MULTICC_RUST_PREBUILT_DIR=${{ runner.temp }}/multicc-rust-prebuilt" >> "$GITHUB_ENV"
      - name: Run deterministic, architecture, and repository governance suites
        run: npm run test:deterministic
      - name: Validate API schemas, golden payloads, and compatibility
        run: npm run test:contracts
      - run: npm run test:native

  isolated-integration:
    name: Isolated HTTP and restart integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: ci-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build Rust SQLite
        run: node scripts/build-rust-kernels.js
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/target
          # 远控进程和模块一起编译：测试会从这棵树打包，缺件就该在这一步报出来。
          MULTICC_REQUIRE_RUST_BUNDLE: '1'
      - name: Configure Rust module
        run: echo "MULTICC_RUST_PREBUILT_DIR=${{ runner.temp }}/multicc-rust-prebuilt" >> "$GITHUB_ENV"
      - name: Configure Git identity for isolated repositories
        shell: bash
        run: |
          git config --global user.name "MultiCC Test"
          git config --global user.email "test@multicc.invalid"
      - name: Run isolated server integration without live AI
        env:
          CLAUDE_CMD: /bin/true
          CODEX_CMD: /bin/true
          OPENCODE_CMD: /bin/true
          ZCODE_CMD: /bin/true
        run: npm run test:integration:isolated

  browser-e2e:
    if: github.event_name == 'workflow_dispatch'
    name: Browser CDP end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install browser video test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build Rust runtime for browser integration
        run: node scripts/build-rust-kernels.js
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
          MULTICC_REQUIRE_RUST_BUNDLE: '1'
      - name: Run all classified browser tests
        shell: bash
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
          MULTICC_TEST_CDP_LOCALE: zh-CN
          MULTICC_H264_CDP_SUITE: relay
          CLAUDE_CMD: /bin/true
          CODEX_CMD: /bin/true
          OPENCODE_CMD: /bin/true
          ZCODE_CMD: /bin/true
        run: |
          set -euo pipefail
          node -e "if (!require('./tests/helpers/cdp-harness').findChromeBinary()) throw new Error('Chrome is required for CDP coverage')"
          node <<'NODE' 2>&1 | tee "$RUNNER_TEMP/cdp-results.log"
          const { spawnSync } = require('child_process');
          const manifest = require('./tests/test-tiers.json');
          const tests = manifest.tests.filter(entry => entry.lane === 'cdp').map(entry => entry.path);
          if (!tests.length || new Set(tests).size !== tests.length) throw Error('Invalid CDP test selection');
          console.log(`Running ${tests.length} classified CDP test files`);
          const result = spawnSync(process.execPath, ['--test', '--test-concurrency=2', ...tests], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
          if grep -Eiq '#[[:space:]]+SKIP([[:space:]]|$)|^# skipped [1-9][0-9]*' "$RUNNER_TEMP/cdp-results.log"; then
            echo '::error::Browser suite skipped tests; CDP coverage is incomplete'
            exit 1
          fi
          if ! grep -Eq '^ok [0-9]+ - h264 stream:' "$RUNNER_TEMP/cdp-results.log"; then
            echo '::error::H.264 relay browser test did not pass'
            exit 1
          fi
      - name: Preserve browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: ${{ runner.temp }}/cdp-results.log
          if-no-files-found: ignore
          retention-days: 7

  flutter-unit:
    if: github.event_name == 'workflow_dispatch'
    name: Complete Flutter unit and widget suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.2'
          cache: true
      - name: Restore Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Run complete Flutter suite
        working-directory: app
        run: flutter test --no-pub

  flutter-remote-screen-e2e:
    if: github.event_name == 'workflow_dispatch'
    name: macOS Flutter remote screen end-to-end
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MULTICC_REQUIRE_RUST_BUNDLE: '1'
      CLAUDE_CMD: /usr/bin/true
      CODEX_CMD: /usr/bin/true
      OPENCODE_CMD: /usr/bin/true
      ZCODE_CMD: /usr/bin/true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.2'
          cache: true
      - run: npm ci
      - name: Restore Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build the current source runtime
        run: node scripts/ensure-source-rust.js
      - name: Run the remote screen integration without skips
        working-directory: app
        shell: bash
        env:
          MULTICC_DATA_DIR: ${{ runner.temp }}/multicc-remote-screen-data
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded test/remote_screen_e2e_test.dart 2>&1 | tee "$RUNNER_TEMP/flutter-remote-screen-e2e.log"
          if grep -Eq '(^|[[:space:]])~[1-9][0-9]*([[:space:]:]|$)|\[SKIP\]' "$RUNNER_TEMP/flutter-remote-screen-e2e.log"; then
            echo '::error::Remote screen integration was skipped'
            exit 1
          fi
          if ! grep -Eq '(^|[[:space:]])\+[1-9][0-9]*:' "$RUNNER_TEMP/flutter-remote-screen-e2e.log"; then
            echo '::error::Remote screen integration did not complete a test'
            exit 1
          fi
      - name: Run H.264 browser P2P on the real macOS host
        shell: bash
        env:
          MULTICC_H264_CDP_SUITE: p2p
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          node -e "if (!require('./tests/helpers/cdp-harness').findChromeBinary()) throw new Error('Chrome is required for CDP coverage')"
          node --test --test-reporter=tap tests/test-remote-screen-h264-cdp.js 2>&1 | tee "$RUNNER_TEMP/h264-p2p-cdp.log"
          if grep -Eiq '#[[:space:]]+SKIP([[:space:]]|$)|^# skipped [1-9][0-9]*' "$RUNNER_TEMP/h264-p2p-cdp.log"; then
            echo '::error::H.264 P2P browser coverage was skipped'
            exit 1
          fi
          if ! grep -Eq '^# pass 1$' "$RUNNER_TEMP/h264-p2p-cdp.log"; then
            echo '::error::H.264 P2P browser test did not pass exactly once'
            exit 1
          fi
