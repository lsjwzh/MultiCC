name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-language:
    name: English commit messages and unified identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Test publication policy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/publication-policy-target
        run: cargo test --locked --manifest-path native/Cargo.toml -p multicc-core publication
      - name: Validate new commit messages, authors and committers
        env:
          CI_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_POLICY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/publication-policy-target
        run: cargo run --locked --quiet --manifest-path native/Cargo.toml -p multicc-core --bin publication-policy -- ci-commits

  deterministic:
    name: Node ${{ matrix.node }} deterministic + storage runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node remains the host; storage is provided by the Rust module built below.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build Rust SQLite
        run: node scripts/build-rust-kernels.js
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
      - name: Configure Rust module
        run: echo "MULTICC_RUST_PREBUILT_DIR=${{ runner.temp }}/multicc-rust-prebuilt" >> "$GITHUB_ENV"
      - name: Run deterministic, architecture, and repository governance suites
        run: npm run test:deterministic
      - name: Validate API schemas, golden payloads, and compatibility
        run: npm run test:contracts
      - run: npm run test:native

  isolated-integration:
    name: Isolated HTTP and restart integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build Rust SQLite
        run: node scripts/build-rust-kernels.js
        env:
          MULTICC_RUST_PREBUILT_DIR: ${{ runner.temp }}/multicc-rust-prebuilt
      - name: Configure Rust module
        run: echo "MULTICC_RUST_PREBUILT_DIR=${{ runner.temp }}/multicc-rust-prebuilt" >> "$GITHUB_ENV"
      - name: Configure Git identity for isolated repositories
        shell: bash
        run: |
          git config --global user.name "$(node -p "require('./commit-policy.json').name")"
          git config --global user.email "$(node -p "require('./commit-policy.json').email")"
      - name: Run isolated server integration without live AI
        env:
          CLAUDE_CMD: /bin/true
          CODEX_CMD: /bin/true
          OPENCODE_CMD: /bin/true
          ZCODE_CMD: /bin/true
        run: npm run test:integration:isolated
