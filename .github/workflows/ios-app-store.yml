name: iOS App Store Cloud Build

on:
  push:
    branches:
      - multicc/multicc-claude-chat-01
    paths:
      - app/**
      - .github/workflows/ios-app-store.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ios-26:
    name: Build unsigned archive with iOS 26 SDK
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.2'
          cache: true

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          printf 'iPhoneOS SDK '
          xcrun --sdk iphoneos --show-sdk-version
          flutter --version

      - name: Resolve locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned release archive
        working-directory: app
        run: >-
          flutter build ipa
          --release
          --no-codesign
          --build-name=2.29.12
          --build-number=124

      - name: Verify archive identity and SDK
        working-directory: app
        run: |
          set -euo pipefail
          archive_path=build/ios/archive/Runner.xcarchive
          app_path="$archive_path/Products/Applications/Runner.app"
          test -d "$archive_path"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = '2.29.12'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = '124'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = 'com.multicc.multiccApp'
          sdk_name="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app_path/Info.plist")"
          case "$sdk_name" in
            iphoneos26*) ;;
            *)
              echo "::error::Expected an iOS 26 SDK build, got $sdk_name"
              exit 1
              ;;
          esac
          printf 'Verified %s (%s), bundle %s, SDK %s\n' \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" \
            "$sdk_name"

      - name: Package unsigned archive
        working-directory: app
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/MultiCC-2.29.12-124-unsigned.xcarchive.tar.gz"
          tar -czf "$artifact" -C build/ios/archive Runner.xcarchive
          test -s "$artifact"
          shasum -a 256 "$artifact"

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: MultiCC-2.29.12-124-unsigned-xcarchive
          path: ${{ runner.temp }}/MultiCC-2.29.12-124-unsigned.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 1
