<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MultiCC</title>
<script src="shell-i18n.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #101218; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    max-width: 620px; margin: 24px; padding: 28px 30px;
    background: #171a23; border: 1px solid #262b38; border-radius: 14px;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  h1 .dot { color: #ff6b6b; }
  .sub { margin: 0 0 18px; font-size: 13px; color: #8b91a3; }
  .detail {
    font-size: 13px; line-height: 1.7; color: #c6cbd9; margin: 0 0 18px;
    padding: 12px 14px; background: #101218; border: 1px solid #262b38;
    border-radius: 10px; white-space: pre-wrap; word-break: break-all;
    max-height: 220px; overflow: auto;
  }
  .detail:empty { display: none; }
  .tail-label { font-size: 12px; color: #8b91a3; margin: 0 0 6px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; padding: 9px 18px; border-radius: 9px; cursor: pointer;
    border: 1px solid #2d3344; background: #1d2230; color: #e8eaf0;
  }
  button.primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
  button:hover { filter: brightness(1.12); }
  .lang { margin-left: auto; padding: 6px 12px; font-size: 12px; color: #9aa1b5; }
  .paths { margin-top: 18px; font-size: 12px; color: #6d7386; line-height: 1.8; user-select: text; }
  .paths code { color: #9aa1b5; }
</style>
</head>
<body data-title-key="docTitleFailed">
<div class="card">
  <h1><span class="dot">●</span> <span id="title" data-shell-i18n="failedTitle"></span></h1>
  <p class="sub" data-shell-i18n="failedSub"></p>
  <div class="detail" id="detail"></div>
  <p class="tail-label" id="tail-label" data-shell-i18n="detail" hidden></p>
  <div class="detail" id="tail" hidden></div>
  <div class="actions">
    <button class="primary" id="retry" data-shell-i18n="retry"></button>
    <button id="logs" data-shell-i18n="openLogs"></button>
    <button id="data" data-shell-i18n="openData"></button>
    <button id="quit" data-shell-i18n="quit"></button>
    <button class="lang" id="lang" data-shell-i18n="language" data-shell-i18n-title="languageTitle"></button>
  </div>
  <div class="paths" id="paths"></div>
</div>
<script>
(function () {
  var shell = window.MultiCCShellI18n;
  var params = new URLSearchParams(location.search);
  var reason = params.get('reason') || 'unknown';
  var message = params.get('message') || '';
  var tail = params.get('tail') || '';
  var logDir = params.get('logDir') || '';
  var dataDir = params.get('dataDir') || '';

  // 失败原因到文案的 key。文案在 shell-i18n.js 里，中英各一份。
  var REASONS = {
    'port-in-use': 'reasonPortInUse',
    'crash-loop': 'reasonCrashLoop',
    'not-ready': 'reasonNotReady',
    'spawn-error': 'reasonSpawnError',
    'missing-runtime': 'reasonMissingRuntime'
  };

  shell.apply();
  document.getElementById('detail').textContent =
    shell.t(REASONS[reason] || 'reasonUnknown') + (message ? '\n\n' + message : '');
  // 后台进程自己的日志末尾也摆上来：这一页是给人截图看的，只给一句「启动失败」
  // 等于把唯一的线索锁在用户机器上的日志文件里。
  if (tail) {
    var tailLabel = document.getElementById('tail-label');
    var tailBox = document.getElementById('tail');
    tailLabel.hidden = false;
    tailBox.hidden = false;
    tailBox.textContent = tail;
  }

  var paths = [];
  var sep = shell.t('labelSep');
  if (logDir) paths.push(shell.t('logsLabel') + sep + '<code>' + escapeHtml(logDir) + '</code>');
  if (dataDir) paths.push(shell.t('dataLabel') + sep + '<code>' + escapeHtml(dataDir) + '</code>');
  document.getElementById('paths').innerHTML = paths.join('<br>');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  document.getElementById('lang').addEventListener('click', function () { shell.toggleLang(); });

  var bridge = window.multiccDesktop;
  function bind(id, fn) {
    document.getElementById(id).addEventListener('click', function () {
      if (bridge) fn(bridge); else console.log('multiccDesktop bridge unavailable');
    });
  }
  bind('retry', function (b) { b.retry(); });
  bind('logs', function (b) { b.openLogs(); });
  bind('data', function (b) { b.openDataFolder(); });
  bind('quit', function (b) { b.quit(); });
})();
</script>
</body>
</html>
