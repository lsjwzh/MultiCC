<!DOCTYPE html>
<html lang="zh" data-i18n-doc-title="dashboardDocTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>MultiCC Dashboard — 会话状态看板</title>
  <script src="/i18n-catalog.js"></script>
  <script src="/i18n.js"></script>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <!-- Header -->
  <div class="dash-header">
    <span class="logo">Multi<span>CC</span></span>
    <span class="title">📊 Dashboard</span>
    <span class="spacer"></span>
    <span class="refresh-indicator">
      <span class="refresh-dot" id="refresh-dot"></span>
      <span id="refresh-label" data-i18n="dashboardConnecting">连接中…</span>
    </span>
    <button id="voice-global-btn" class="hdr-btn voice-global-btn" data-i18n-title="dashboardVoiceTitle" title="全局实时语音：不绑定具体会话，由语音 Router 选择对应项目的普通 Worker">
      <span aria-hidden="true">📞</span><span class="voice-label" data-i18n="dashboardVoiceLabel">实时语音</span><span class="beta-badge">BETA</span>
    </button>
    <a href="/" class="hdr-btn" data-i18n-title="terminal" title="终端">🖥️ <span data-i18n="terminal">终端</span></a>
    <a href="/chat" class="hdr-btn" data-i18n-title="dashboardChat" title="聊天">💬 <span data-i18n="dashboardChat">聊天</span></a>
    <a href="/manage" class="hdr-btn" data-i18n-title="manage" title="管理">⚙️ <span data-i18n="manage">管理</span></a>
    <button class="hdr-btn lang-toggle" type="button" onclick="toggleLang()" data-i18n-title="languageToggle" title="切换语言：中文 / English"></button>
  </div>

  <!-- Main content -->
  <div class="dash-main">
    <!-- Error box -->
    <div id="error-box" class="error-state" style="display:none"></div>

    <!-- Stats cards -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label" data-i18n="dashboardStatTotal">总会话数</div>
        <div class="stat-value">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" data-i18n="activeSessions">活跃会话</div>
        <div class="stat-value">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" data-i18n="dashboardStatCli">CLI 分布</div>
        <div class="stat-value">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" data-i18n="dashboardStatKind">类型分布</div>
        <div class="stat-value">—</div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label data-i18n="dashboardFilterKind">类型:</label>
        <select id="filter-kind">
          <option value="" data-i18n="dashboardAll">全部</option>
          <option value="chat">chat</option>
          <option value="terminal">terminal</option>
          <option value="gateway">gateway</option>
        </select>
      </div>
      <div class="filter-group">
        <label data-i18n="dashboardFilterStatus">状态:</label>
        <button class="filter-active active" data-value="" data-i18n="dashboardAll">全部</button>
        <button class="filter-active" data-value="true" data-i18n="dashboardActive">活跃</button>
        <button class="filter-active" data-value="false" data-i18n="dashboardInactive">非活跃</button>
      </div>
      <span class="spacer" style="flex:1"></span>
      <span style="font-size:12px;color:var(--muted)"><span data-i18n="dashboardCountPrefix">共</span> <b id="session-count" style="color:var(--fg)">0</b> <span data-i18n="dashboardCountUnit">个会话</span> · <span data-i18n="dashboardAutoRefresh">每 5s 自动刷新</span></span>
    </div>

    <!-- Sessions table -->
    <div id="table-wrap" class="table-wrap">
      <div class="loading-state" data-i18n="loading">加载中…</div>
    </div>
  </div>

  <script src="/voice-launch-client.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
