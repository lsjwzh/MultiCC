<!DOCTYPE html>
<html lang="zh" data-i18n-doc-title="fleetShareDocTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <title>MultiCC — 工作区分享</title>
  <script src="i18n-catalog.js"></script>
  <script src="i18n.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0a0c10;color:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{position:relative;width:min(560px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:#181d27;box-shadow:0 18px 50px rgba(0,0,0,.35)}.mark{font-size:13px;color:#3ad6c5;font-weight:700;letter-spacing:.5px}.card h1{font-size:22px;margin:10px 0 8px}.card p{color:#969db0;line-height:1.65;margin:0 0 18px}.steps{padding:14px 16px;background:#0e1116;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#cdd3de;line-height:1.7;font-size:14px}.url{width:100%;margin-top:14px;padding:10px 12px;border:1px solid rgba(58,214,197,.35);border-radius:9px;background:#0a0c10;color:#6aa3ff;font:12px ui-monospace,monospace}.hint{font-size:12px!important;margin-top:14px!important;color:#6a7280!important}.lang-toggle{position:absolute;top:14px;right:14px;padding:4px 10px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:transparent;color:#969db0;font-size:12px;cursor:pointer}.lang-toggle:hover{color:#eef1f6;border-color:rgba(255,255,255,.35)}
  </style>
</head>
<body>
  <main class="card">
    <button class="lang-toggle" type="button" onclick="toggleLang()" data-i18n-title="languageToggle" title="切换语言：中文 / English"></button>
    <div class="mark">MULTICC · WORKSPACE SHARE</div>
    <h1 data-i18n="fleetShareTitle">收到一个工作区分享</h1>
    <p data-i18n="fleetShareIntro">这是受密码保护的工作区范围授权。导入后可打开和操作该工作区的会话；命令仍在来源实例执行，且不会开放其他工作区或 Provider 凭据。</p>
    <div class="steps" data-i18n="fleetShareSteps">在目标 MultiCC 打开管理页，点击顶部的「导入工作区」，粘贴下面的链接并输入分享者提供的密码。</div>
    <input id="share-url" class="url" readonly data-i18n-aria-label="fleetShareUrlLabel" aria-label="工作区分享链接" />
    <p class="hint" data-i18n="fleetShareHint">分享密码请通过单独渠道获取。每次导入会消耗一次分享访问次数。</p>
  </main>
  <script>document.getElementById('share-url').value=location.href;</script>
</body>
</html>
