<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><title>MultiCC Air · 工作目录与任务</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="air.css"><script src="auth-client.js"></script></head>
<body><aside id="sidebar"><a class="brand" href="/air">M <span>MultiCC <b>Air</b></span></a><button id="library">▦ 工作目录 <kbd>⌘ K</kbd></button><button id="activity">◷ 正在执行</button><div class="caption">收藏目录</div><nav id="favorites"></nav><div class="side-bottom"><a href="/manage">服务、文档与设置 ↗</a><small>让每一次对话，都有清晰的目标。</small></div></aside>
<main><header><button id="mobile-nav" aria-label="打开导航">☰</button><div class="breadcrumb"><span class="caption">工作目录</span><h1 id="directory-name">正在读取…</h1><small id="directory-path"></small></div><button id="favorite" aria-label="收藏当前工作目录">☆</button><button id="refresh" aria-label="刷新">↻</button><button id="create" class="primary">＋ 新任务</button></header><p id="notice" role="status" aria-live="polite"></p>
<section id="directory-library" hidden><div class="section-heading"><h2>你的工作目录</h2><a href="/manage">添加工作目录 ↗</a></div><input id="directory-search" type="search" placeholder="搜索名称或路径" aria-label="搜索工作目录"><div id="directory-grid"></div></section>
<section id="task-layout"><div id="task-sidebar"><div class="section-heading"><h2 id="task-list-title">任务</h2><span id="task-count"></span></div><input id="task-search" type="search" placeholder="搜索任务" aria-label="搜索任务"><select id="status-filter" aria-label="任务筛选"><option value="active">进行中与待处理</option><option value="all">全部记录</option><option value="archived">已归档</option></select><nav id="tasks"></nav><details><summary>会话与终端</summary><nav id="legacy-sessions"></nav></details></div>
<div id="task-content"><div id="empty"><div class="hero-icon">✧</div><h2>从一个目标开始</h2><p>选择任务继续，或在当前工作目录中创建新任务。</p><p>工作目录会在任务首次执行时准备。</p></div><div id="task-header" hidden><div><h2 id="task-title"></h2><span id="task-state"></span></div><div class="task-tools"><span id="ai-capsule"></span><button id="details-toggle" aria-expanded="false">详情</button></div></div><aside id="task-details" hidden></aside><iframe id="conversation" title="任务对话" hidden></iframe></div></section></main>
<dialog id="new-task-dialog"><form id="new-task-form"><div class="section-heading"><h2>新任务</h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div><p id="create-directory"></p><label>任务名称<input name="title" required maxlength="120" placeholder="例如：完善登录页面"></label><div class="form-row"><label>AI 工具<select name="cli" id="cli"></select></label><label>模型（可选）<input name="model" maxlength="100" placeholder="跟随默认配置"></label></div><details><summary>角色上下文（可选）</summary><label>本任务的角色说明<textarea name="rolePrompt" rows="4" maxlength="40000" placeholder="例如：以移动端体验设计师的视角检查交互"></textarea></label></details><p id="create-error" role="alert"></p><button id="create-submit" class="primary" type="submit">创建任务</button></form></dialog>
<script src="air.js"></script></body></html>
