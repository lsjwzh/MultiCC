<!DOCTYPE html>
<html lang="zh" data-i18n-doc-title="eventsDocTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>📋 活动记录 · MultiCC</title>
  <script src="i18n-catalog.js"></script>
  <script src="i18n.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #header {
      flex-shrink: 0; background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    #title { flex: 1; min-width: 0; }
    #title-name { font-size: 15px; font-weight: 680; color: #f0f6fc; }
    #title-sub {
      font-size: 11px; color: #58a6ff; font-family: monospace;
      margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
      border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #30363d; }
    #body { flex: 1; overflow: auto; padding: 14px 16px; }
    .evt-row {
      display: flex; gap: 10px; padding: 7px 10px; border-radius: 6px;
      font-size: 13px; line-height: 1.5; border-bottom: 1px solid rgba(48,54,61,0.4);
    }
    .evt-row:hover { background: rgba(255,255,255,0.02); }
    .evt-time { color: #8b949e; font-family: monospace; font-size: 11px; flex-shrink: 0; min-width: 64px; padding-top: 2px; }
    .evt-label { flex: 1; min-width: 0; word-break: break-word; }
    .empty { color: #6e7681; text-align: center; padding: 40px 0; font-size: 13px; }
    #count { color: #6e7681; font-size: 11px; padding: 0 16px 10px; flex-shrink: 0; border-bottom: 1px solid #21262d; }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">
      <div id="title-name" data-i18n="eventsTitle">📋 活动记录</div>
      <div id="title-sub" data-i18n="loading">加载中…</div>
    </div>
    <button class="btn lang-toggle" onclick="toggleLang()" data-i18n-title="languageToggle" title="切换语言：中文 / English"></button>
    <button class="btn" onclick="refresh()" data-i18n="eventsRefresh">↻ 刷新</button>
  </div>
  <div id="count"></div>
  <div id="body"><div class="empty" data-i18n="loading">加载中…</div></div>
  <script src="error-envelope.js"></script>
  <script src="auth-client.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const dirId = params.get('dirId') || '';
    const dirsApi = '/api/directories';
    const eventsApi = `/api/directories/${encodeURIComponent(dirId)}/events`;

    function emptyRow(text) {
      const div = document.createElement('div'); div.className = 'empty'; div.textContent = text; return div;
    }
    // 每类事件一条模板，再各自带一个「没写 detail 时说什么」的词条。以前这里是
    // 一整段中文模板串死在 JS 里，英文界面下整屏都是中文。
    const EVENT_KEYS = {
      session_created: ['eventsEvtSessionCreated', null],
      session_renamed: ['eventsEvtSessionRenamed', null],
      session_model_changed: ['eventsEvtModelChanged', null],
      session_deleted: ['eventsEvtSessionDeleted', null],
      merged: ['eventsEvtMerged', null],
      memory_updated: ['eventsEvtMemoryUpdated', 'eventsDetailMemoryUpdated'],
      synced: ['eventsEvtSynced', null],
      sync_conflict: ['eventsEvtSyncConflict', 'eventsDetailSyncConflict'],
      dispatch: ['eventsEvtDispatch', null],
      note: ['eventsEvtNote', null],
      note_delivered: ['eventsEvtNoteDelivered', null],
      session_role_changed: ['eventsEvtRoleChanged', 'eventsDetailRoleChanged'],
      session_streaming_changed: ['eventsEvtStreamingChanged', 'eventsDetailStreamingChanged'],
      session_autocontinue_changed: ['eventsEvtAutoContinue', 'eventsDetailAutoContinue'],
      session_autocommit_changed: ['eventsEvtAutoCommit', 'eventsDetailAutoCommit'],
      session_provider_changed: ['eventsEvtProviderChanged', 'eventsDetailProviderChanged'],
      trigger_added: ['eventsEvtTriggerAdded', 'eventsDetailTriggerAdded'],
      pushed: ['eventsEvtPushed', 'eventsDetailPushed'],
    };
    function eventLabel(evt) {
      const who = evt.sessionLabel || evt.sessionId || '';
      const entry = EVENT_KEYS[evt.type];
      if (!entry) return `· ${evt.type} ${who}`;
      const [templateKey, defaultKey] = entry;
      const detail = evt.detail || (defaultKey ? t(defaultKey) : '');
      return t(templateKey, { who, detail });
    }
    function fmtTs(ts) {
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString(getLocale(), { hour12: false });
      return d.toLocaleDateString(getLocale()) + ' ' + d.toLocaleTimeString(getLocale(), { hour12: false });
    }

    async function refresh() {
      try {
        const [dirRes, evtRes] = await Promise.all([
          fetch(dirsApi).then(r => r.json()),
          fetch(eventsApi).then(r => r.json()),
        ]);
        const dir = (Array.isArray(dirRes) ? dirRes : []).find(d => d.id === dirId);
        document.getElementById('title-name').textContent = '📋 ' + (dir ? dir.name : t('eventsTitlePlain'));
        document.getElementById('title-sub').textContent = dir ? dir.path : dirId;
        const events = (evtRes.events || []).slice().reverse();
        const body = document.getElementById('body');
        document.getElementById('count').textContent = events.length ? t('eventsCount', { n: events.length }) : '';
        if (!events.length) {
          body.replaceChildren(emptyRow(t('eventsEmpty')));
          return;
        }
        body.replaceChildren(...events.map(e => {
          const row = document.createElement('div'); row.className = 'evt-row';
          const time = document.createElement('span'); time.className = 'evt-time'; time.textContent = fmtTs(e.ts);
          const label = document.createElement('span'); label.className = 'evt-label'; label.textContent = eventLabel(e);
          row.append(time, label);
          return row;
        }));
      } catch (e) {
        document.getElementById('body').replaceChildren(emptyRow(t('eventsLoadFailed', { message: e.message })));
      }
    }
    refresh();
  </script>
</body>
</html>
