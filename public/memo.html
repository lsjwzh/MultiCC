<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>📝 Memo · MultiCC</title>
  <script src="error-envelope.js"></script>
  <script src="auth-client.js"></script>
  <script src="api-client.js"></script>
  <script src="memo-controller.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #header {
      flex-shrink: 0; background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    }
    #title { flex: 1; min-width: 0; }
    #title-name { font-size: 14px; font-weight: 600; color: #f0f6fc; }
    #title-path {
      font-size: 11px; color: #8b949e; font-family: monospace;
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    #memo-text {
      flex: 1; width: 100%; background: #0d1117; color: #c9d1d9;
      border: 0; outline: 0; padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 1.6; resize: none; overflow: auto;
    }
    #status {
      flex-shrink: 0; padding: 6px 14px; font-size: 11px;
      color: #6e7681; font-family: monospace;
      border-top: 1px solid #21262d; background: #161b22;
      min-height: 28px;
    }

    #picker { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10000; align-items: center; justify-content: center; }
    #picker.open { display: flex; }
    .picker-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px 18px; width: min(90vw, 440px); }
    .picker-card h3 { font-size: 13px; color: #f0f6fc; margin-bottom: 6px; }
    .picker-preview { color: #8b949e; font-size: 11px; margin-bottom: 10px; font-family: monospace; word-break: break-word; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 6px 8px; max-height: 90px; overflow: auto; }
    .picker-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 280px; overflow: auto; }
    .picker-list button { display: flex; justify-content: space-between; gap: 10px; text-align: left; }
    .picker-actions { text-align: right; }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">
      <div id="title-name">📝 备忘</div>
      <div id="title-path">加载中…</div>
    </div>
    <button class="btn" id="send-btn" title="把光标所在行发到该工作区的 chat 会话">→ 发送当前行</button>
    <button class="btn btn-primary" id="save-btn" title="保存 (Ctrl/Cmd+S)">保存</button>
    <button class="btn" onclick="window.close()">关闭</button>
  </div>
  <textarea id="memo-text" spellcheck="false" placeholder="在这里写备忘…&#10;例：&#10;# todo&#10;- [ ] 任务一&#10;- [ ] 任务二"></textarea>
  <div id="status"></div>

  <div id="picker">
    <div class="picker-card">
      <h3>发送到 chat 会话</h3>
      <div class="picker-preview" id="picker-preview"></div>
      <div class="picker-list" id="picker-list"></div>
      <div class="picker-actions"><button class="btn" id="picker-cancel">取消</button></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let _dirId = params.get('dirId') || '';
    const _sessionId = params.get('sessionId') || '';

    const memoClient = window.MultiCCMemo.createClient({ api: window.MultiCCApi });
    const memoController = window.MultiCCMemo.createController({
      client: memoClient,
      document,
      ids: {
        modal: null,
        status: 'status',
        title: 'title-name',
        subtitle: 'title-path',
        picker: 'picker',
        pickerPreview: 'picker-preview',
        pickerList: 'picker-list',
      },
      requireDirectory: false,
      ui: {
        showModal: () => {},
        hideModal: () => {},
        showPicker: picker => picker && picker.classList.add('open'),
        hidePicker: picker => picker && picker.classList.remove('open'),
        previewLength: 200,
        onDirectory: directory => {
          document.title = `📝 ${directory.name || directory.id} · Memo · MultiCC`;
        },
      },
    });

    function setStatus(message) { $('status').textContent = message; }

    async function bootstrap() {
      try {
        _dirId = await memoClient.resolveDirectoryId({ dirId: _dirId, sessionId: _sessionId });
    if (!_dirId) { setStatus('缺少 dirId / sessionId 参数，或会话没有工作区归属'); return; }
        await loadMemo();
      } catch (error) {
        setStatus('初始化失败：' + memoClient.errorMessage(error));
      }
    }

    async function loadMemo() {
      return memoController.openMemo(_dirId);
    }

    const saveMemo = memoController.memoSave;
    const currentLineText = memoController.memoCurrentLineText;
    const openPicker = memoController.memoSendCurrentLine;
    const closePicker = memoController.memoPickerClose;
    const confirmSend = memoController.memoConfirmSend;

    $('save-btn').onclick = saveMemo;
    $('send-btn').onclick = openPicker;
    $('picker-cancel').onclick = closePicker;
    Object.assign(window, { bootstrap, loadMemo, saveMemo, currentLineText, openPicker, closePicker, confirmSend });

    Promise.resolve(window.multiccAuthReady).then(bootstrap);
  </script>
</body>
</html>
