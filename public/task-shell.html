<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiCC · Task shell</title><link rel="stylesheet" href="task-shell.css"></head>
<body><main>
  <header><h1 data-i18n="taskShellTitle"></h1><a href="/manage" data-i18n="taskShellBack"></a></header>
  <p data-i18n="taskShellIntro"></p><p id="notice" role="status" aria-live="polite"></p>
  <section class="toolbar">
    <label><span data-i18n="taskShellTarget"></span><select id="tasks"></select></label>
    <label><span data-i18n="taskShellAttach"></span><select id="available"></select></label>
    <button id="attach" data-i18n="taskShellAttachButton"></button>
  </section>
  <p id="state" aria-live="polite"></p><div id="origin"></div><details id="snapshot-details" hidden><summary data-i18n="taskShellSnapshotDetails"></summary><div id="snapshot-info"></div></details>
  <section id="history" aria-label="Messages"></section>
  <section id="question" hidden><strong data-i18n="taskShellPendingQuestion"></strong><p id="question-text"></p><div id="choices"></div><button id="answer" data-i18n="taskShellAnswer"></button></section>
  <details><summary data-i18n="taskShellReferences"></summary><p data-i18n="taskShellReferencesHelp"></p>
    <select id="references" multiple size="4" aria-label="Context references"></select>
    <label><input type="checkbox" id="dependency"><span data-i18n="taskShellDependency"></span></label>
  </details>
  <form id="composer"><label for="message" id="input-label" data-i18n="taskShellWork"></label>
    <textarea id="message" required maxlength="32000" rows="4" data-i18n-placeholder="taskShellPlaceholder"></textarea>
    <div class="toolbar"><button id="send" type="submit" data-i18n="taskShellSend"></button>
      <button id="steer" type="button" data-i18n="taskShellSteer"></button>
      <button id="work" type="button" data-i18n="taskShellWork"></button>
      <button id="cancel" type="button" data-i18n="taskShellCancel"></button>
      <button id="retry" type="button" hidden data-i18n="taskShellRetry"></button>
    </div>
  </form>
  <details><summary data-i18n="taskShellReceipts"></summary><div id="receipts"></div></details>
  <footer><button id="detach" data-i18n="taskShellDetach"></button><p data-i18n="taskShellScope"></p></footer>
</main><script src="i18n-catalog.js"></script><script src="i18n.js"></script><script src="auth-client.js"></script>
<script src="vendor/dompurify/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
<script src="safe-markdown.js"></script><script src="task-shell-client.js"></script><script src="task-shell.js"></script></body></html>
