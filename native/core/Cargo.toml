[package]
name = "multicc-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
ryu-js = "1"
sha1 = "0.10"
base64 = "0.22"
fs2 = "0.4"
sha2 = "0.10"
getrandom = "0.3"
regex = "1.13.1"
memchr = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["net", "time", "rt", "io-util", "sync", "macros"] }
futures-util = "0.3"
bytes = "1"
unicode-normalization = "0.1.26"
url = "2"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
