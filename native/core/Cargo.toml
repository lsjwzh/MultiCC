[package]
name = "multicc-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
ryu-js = "1"
sha1 = "0.10"
base64 = "0.22"
