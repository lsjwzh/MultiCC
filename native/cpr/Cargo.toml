[package]
name = "multicc-cpr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "stream", "socks", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
percent-encoding = "2"

multicc-core = { path = "../core" }
