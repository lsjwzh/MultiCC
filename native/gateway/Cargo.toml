[package]
name = "multicc-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "multicc-gateway"
path = "src/main.rs"

[lib]
name = "multicc_gateway"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
http-body-util = "0.1"
http-body = "1"
futures-util = "0.3"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
multicc-core = { path = "../core" }
multicc-cpr = { path = "../cpr" }
chrono = "0.4"
chrono-tz = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
